<div id="share-preserved" aria-label="기능을 유지한 모바일 5탭 구조"></div>
<style>
#share-preserved{--canvas:light-dark(#fff,#101013);--panel:light-dark(#f9fafb,#17171c);--box:light-dark(#f2f4f6,#29292f);--ink:light-dark(#191f28,#e5e8eb);--muted:light-dark(#6b7684,#a9adb8);--line:light-dark(#e5e8eb,#34343e);--accent:light-dark(#1b64da,#6ba5ff);--danger:light-dark(#d22030,#ff7b86);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.65;color:var(--ink);background:var(--canvas);max-width:430px;margin:0 auto;border:1px solid var(--line);border-radius:20px;overflow:clip;word-break:keep-all}
#share-preserved *{box-sizing:border-box}#share-preserved .stamp{background:var(--box);padding:8px 16px;color:var(--muted);font-size:12px}#share-preserved header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 16px 12px}#share-preserved .name{font-size:20px;font-weight:800}#share-preserved .minor{font-size:12px;color:var(--muted)}#share-preserved .badge{font-size:12px;display:inline-block;background:var(--box);border-radius:8px;padding:3px 7px}#share-preserved main{padding:8px 16px 24px;min-height:460px}#share-preserved h1{font-size:23px;line-height:1.35;margin:8px 0 18px;font-weight:700;letter-spacing:-.5px}#share-preserved h2{font-size:16px;margin:0 0 12px;font-weight:800}#share-preserved p{margin:0 0 10px}#share-preserved .block{padding:20px;background:var(--panel);border-radius:20px;margin-bottom:12px}#share-preserved .facts{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0}#share-preserved dt{color:var(--muted)}#share-preserved dd{margin:0;font-variant-numeric:tabular-nums}#share-preserved .warn{color:var(--danger)}#share-preserved button,#share-preserved summary{font:inherit;color:inherit;min-height:44px}#share-preserved button{border:0;background:transparent;padding:10px 0;text-align:left}#share-preserved details{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}#share-preserved summary{padding:10px 0;font-weight:600}#share-preserved .row{display:block;width:100%;border-bottom:1px solid var(--line);padding:14px 0}#share-preserved .row strong{display:block}#share-preserved .row small{display:block;color:var(--muted);font-size:13px}#share-preserved .link{color:var(--accent)}#share-preserved .segment{display:flex;gap:4px;background:var(--box);padding:4px;border-radius:14px;margin-bottom:16px}#share-preserved .segment button{flex:1;text-align:center;border-radius:10px;font-size:13px;padding:10px 4px}#share-preserved .segment button[aria-pressed=true]{background:var(--panel);font-weight:800}#share-preserved nav{display:flex;border-top:1px solid var(--line);padding:6px 6px 12px}#share-preserved nav button{flex:1;text-align:center;color:var(--muted);font-size:12px;display:flex;align-items:center;flex-direction:column;gap:4px}#share-preserved nav button[aria-current=page]{color:var(--accent);font-weight:800}#share-preserved .reading{font-size:16px;line-height:1.75;font-weight:400;word-break:normal;overflow-wrap:break-word;padding:16px 0;border-top:1px solid var(--line)}#share-preserved .stem{font-size:17px;line-height:1.6;font-weight:700;margin:16px 0}#share-preserved .answer{font-size:15px;padding:12px 0}#share-preserved .barrow{margin:14px 0}#share-preserved .barlabel{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}#share-preserved .track{height:7px;background:var(--box);border-radius:7px;margin:6px 0}#share-preserved .fill{height:100%;background:var(--accent);border-radius:7px}#share-preserved .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px;margin-top:12px}#share-preserved .day{padding:5px 0;border-radius:6px}#share-preserved .day.present{background:var(--box);font-weight:800}#share-preserved .day.absent{color:var(--danger);font-weight:800}#share-preserved .metric{display:block;width:100%;border-bottom:1px solid var(--line);padding:12px 0}#share-preserved .metric strong{font-size:20px;margin-left:14px}#share-preserved .metric small{display:block;font-size:12px;color:var(--muted)}#share-preserved .graph{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}#share-preserved .point{background:var(--box);border-radius:12px;text-align:center;padding:12px;font-variant-numeric:tabular-nums}#share-preserved .point strong{display:block;font-size:20px}#share-preserved .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}#share-preserved input,#share-preserved select{font:inherit;color:var(--ink);background:var(--box);border:1px solid var(--line);border-radius:12px;min-height:44px;width:100%;padding:9px 12px}#share-preserved label{display:block;margin:8px 0;font-size:13px}#share-preserved .search{margin:12px 0}#share-preserved .action{width:100%;text-align:center;background:var(--box);border-radius:14px;padding:12px;margin-top:12px;font-weight:700}#share-preserved .note{padding:14px;background:var(--box);border-radius:14px;margin:14px 0}#share-preserved .paper{background:light-dark(#fff,#fff);color:light-dark(#191f28,#191f28);border:1px solid var(--line);padding:16px;font-family:Georgia,serif;word-break:normal;font-size:15px}
</style>
<script>
(()=>{
const root=document.getElementById('share-preserved');
let state={tab:'home',sub:'reading',scope:'period',att:'regular',metric:'reading',page:null,search:'',mode:'all',pos:'all',week:'all',example:'all',passage:'all',question:0,recordFocus:1,returnTab:'wrong'};
const opts={questionView:'list',wordDetail:false};
const b=(t,a,c='',extra='')=>`<button type="button" class="cursor-interaction ${c}" data-action="${a}" ${extra}>${t}</button>`;
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const segment=(items,value,prefix)=>`<div class="segment">${items.map(([id,label])=>b(label,prefix+':'+id,'',`aria-pressed="${id===value}"`)).join('')}</div>`;
const block=(title,body)=>`<section class="block"><h2>${title}</h2>${body}</section>`;
const fold=(title,body,open=false)=>`<details ${open?'open':''}><summary class="cursor-interaction">${title}</summary>${body}</details>`;
const words=[{word:'adapt',meaning:'적응하다',pos:'동사',week:'2',passage:'A',mine:'채택하다',status:'pending',syn:'adjust',ant:'resist',der:'adaptation · 적응',ex:'We adapt to new environments.',ko:'우리는 새로운 환경에 적응한다.'},{word:'maintain',meaning:'유지하다',pos:'동사',week:'2',passage:'A',mine:'',status:'pending',syn:'preserve',ant:'abandon',der:'maintenance · 유지',ex:'Maintain a regular study schedule.',ko:'규칙적인 학습 일정을 유지해라.'},{word:'evidence',meaning:'증거',pos:'명사',week:'1',passage:'B',mine:'사건',status:'done',syn:'proof',ant:'',der:'evident · 분명한',ex:'Find evidence in the passage.',ko:'지문에서 근거를 찾아라.'},{word:'reliable',meaning:'믿을 만한',pos:'형용사',week:'1',passage:'B',mine:null,status:'clean',syn:'dependable',ant:'unreliable',der:'reliability · 신뢰성',ex:'',ko:''}];
const q=[{label:'빈칸 추론',number:3,stem:'다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?',passage:'Students often focus only on their final score. However, improvement begins when they look closely at why an answer was wrong. Comparing their reasoning with evidence in the passage helps them discover patterns in their mistakes. In this way, mistakes can become ________.',choices:['proof that learning should stop','useful information for future learning','a reason to avoid difficult questions'],mine:3,answer:2,explain:'점수보다 오답의 원인을 살피는 과정이 중요하다는 내용이에요. “In this way”가 앞의 과정을 받으므로, 실수는 다음 학습에 도움이 되는 정보가 된다는 ②가 알맞아요.',comment:'빈칸 앞 문장의 evidence와 patterns에 밑줄을 그어 보세요.'},{label:'주장 파악',number:7,stem:'다음 글에서 필자의 주장으로 가장 적절한 것은?',passage:'A short study session every day can be more effective than a long session once a week. Repeatedly returning to the same material helps you recall it. Set aside a small amount of time each day.',choices:['Study a little every day.','Study only when you have several hours.','Avoid reviewing the same material.'],mine:2,answer:1,explain:'매일 짧게 시간을 내라는 마지막 문장에 필자의 주장이 나타나요.',comment:'결론 문장을 먼저 확인해 보세요.'}];
function restore(w){if(w?.privateContent?.version!==2)return;state={...state,...w.privateContent.state};Object.assign(opts,w.privateContent.options);state.search=typeof state.search==='string'?state.search:'';}
restore(window.openai?.widgetState);
function save(){window.openai?.setWidgetState({modelContent:{design:'기능 유지 5탭 구조 검토',tab:state.tab,questionView:opts.questionView,wordDetails:opts.wordDetail},privateContent:{version:2,state,options:opts}})?.catch(()=>{});}
const escape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function metrics(){const rows=[['reading','시험',70,'+20%p','+5%p'],['vocab','단어',75,'+10%p','+3%p'],['homework','과제',90,'+20%p',null]];const selected=rows.find(x=>x[0]===state.metric);const values=state.metric==='reading'?[60,80]:state.metric==='vocab'?[70,80]:[80,100];return `${rows.map(([id,label,mean,delta,comp])=>b(`${label}<strong>${mean}%</strong><span class="minor"> · 기간 평균</span><small>직전 회차 대비 ${delta}${comp?' · 기간 반 비교 '+comp:''}</small><span class="minor">${state.metric===id?'추이 선택됨':'추이 보기'}</span>`,'metric:'+id,'metric',`aria-pressed="${state.metric===id}"`)).join('')}<p class="minor" style="margin-top:14px">${selected[1]} 회차별 추이 · 정답률/제출률</p><div class="graph">${values.map((v,i)=>b(`<span class="minor">9/${i?24:17}</span><strong>${v}%</strong>${state.metric==='homework'?'':`<span class="minor">반 평균 ${state.metric==='reading'?(i?70:60):(i?74:70)}%</span>`}`,'history:'+i,'point')).join('')}</div>${b('출결 · 2회 연속 출석 →','attendance','row')}`;}
function home(){return block('최근 수업 · 9월 2회차 · 9/24',`<span class="badge">출석</span><h1>시험·단어 모두<br>직전 회차보다 올랐어요</h1><dl class="facts"><dt>시험</dt><dd>8/10 · 80%<br><span class="minor">+20%p · 반 평균 +10%p</span></dd><dt>단어</dt><dd>16/20 · 80%<br><span class="minor">+10%p · 반 평균 +6%p</span></dd><dt>과제</dt><dd>5/5 제출</dd></dl>`)+block('선생님 코멘트',`<p>글의 흐름을 잘 따라가고 있어요. 빈칸 앞뒤 문장에서 근거를 찾는 연습을 해 보세요.</p>${fold('이전 코멘트 1개','<p class="minor">9/17 · 1회차</p><p>오답을 확인할 때 연결어에 표시해 보세요.</p>')}`)+block('이번 수업에서 복습할 것',b('<strong>진단평가 오답 2문항</strong><small>해설 보고 다시 풀기 →</small>','wrong:reading','row')+b('<strong>단어 오답 4개</strong><small>재시험 2/4 통과 · 2개 남음 →</small>','wrong:vocab','row'))+block('9월 요약 · 2회차',metrics());}
function record(){return `<h1>회차별 기록</h1>${segment([['period','9월'],['all','전체 기간']],state.scope,'scope')}${state.scope==='all'?'<p class="minor">9월 · 2회차</p>':''}${[1,0].map(i=>block(`9월 ${i+1}회차 · 9/${i?24:17}`,`<span class="badge">출석</span><dl class="facts" style="margin-top:12px"><dt>시험</dt><dd>${i?'8':'6'}/10 · 반 ${i?'+10':'0'}%p</dd><dt>단어</dt><dd>${i?'16':'14'}/20 · 반 ${i?'+6':'0'}%p</dd><dt>재시험</dt><dd>${i?'2/4 통과':'미응시'}</dd><dt>과제</dt><dd>${i?'5/5':'4/5 · 1개 미제출'}</dd></dl>${fold('오답 유형·코멘트',`<p>${i?'빈칸 추론 · 주장 파악':'빈칸 추론 · 어법'}</p><p>${i?'빈칸 앞뒤 문장에서 근거를 찾아보세요.':'연결어에 표시하며 읽어보세요.'}</p>${i?b('이 회차 오답 보기 →','wrong:reading','link'):'<p class="minor">과거 회차 전문은 구조 시안에서 생략</p>'}`,i===state.recordFocus)}`)).join('')}${state.scope==='all'?block('8월 · 1회차', '<dl class="facts"><dt>시험</dt><dd>7/10</dd><dt>단어</dt><dd>15/20</dd><dt>과제</dt><dd>5/5</dd><dt>출결</dt><dd>출석</dd></dl>'):''}${block('출결 현황',`<p>정규수업 ${state.scope==='all'?'3/3':'2/2'} · 클리닉 1/2</p>${segment([['regular','정규수업'],['clinic','클리닉']],state.att,'att')}<p>2026년 9월</p><div class="calendar">${['일','월','화','수','목','금','토'].map(v=>`<span class="minor">${v}</span>`).join('')}<span></span><span></span>${Array.from({length:30},(_,i)=>`<span class="day ${state.att==='regular'&&[17,24].includes(i+1)||state.att==='clinic'&&i+1===19?'present':state.att==='clinic'&&i+1===26?'absent':''}">${i+1}${state.att==='clinic'&&i+1===26?'×':''}</span>`).join('')}</div><p class="minor" style="margin-top:12px">굵은 날짜: 출석 · ×: 결석 · 나머지: 수업 기록 없음</p>`)}`;}
function analysis(){return `<h1>분석</h1><p class="minor">9월 · 2회차 누적 · 20문항</p>${block('영역별 정답률',[['이해',90,'주장 파악·내용 일치'],['추론',40,'빈칸 추론'],['어법',60,'문장 구조']].map(([label,rate,tags])=>`<div class="barrow"><div class="barlabel"><strong>${label}</strong><span>${rate}%</span></div><div class="track"><div class="fill" style="width:${rate}%"></div></div><span class="minor">${tags}</span></div>`).join(''))}${block('유형별 오답률',b('<strong>빈칸 추론 · 60%</strong><small>5문항 중 3문항 오답 · 문제 보기 →</small>','type','row')+b('<strong>주장 파악 · 20%</strong><small>5문항 중 1문항 오답 · 문제 보기 →</small>','type:claim','row')+fold('다른 유형 보기','<p>어법 · 40% (2/5)</p><p>내용 일치 · 0% (0/5)</p>'))}${block('약점 패턴',`<div class="row"><span class="badge">개선</span><h2 style="margin-top:8px">빈칸 추론</h2><p>정답률이 올랐지만 아직 오답이 남아 있어요.</p><p class="minor">누적 정답률 40% · 2/5</p><p>1회차 0/2 → 2회차 2/3</p>${b('관련 문제 보기 →','type','link')}</div><div class="row"><span class="badge">악화</span><h2 style="margin-top:8px">주장 파악</h2><p>1회차 2/2 → 2회차 2/3</p><p class="minor">누적 정답률 80% · 4/5</p></div>`)}`;}
function questionBody(item){return `<p class="stem">${item.stem}</p><p class="reading" lang="en">${item.passage}</p>${item.choices.map((c,i)=>`<p class="reading" lang="en">${['①','②','③'][i]} ${c}</p>`).join('')}<p class="answer"><span class="warn">내 답 ${item.mine}</span> · 정답 ${item.answer}</p><div class="note"><h2>해설</h2><p>${item.explain}</p><p class="minor">선생님 첨삭</p><p>${item.comment}</p></div>`;}
function wrong(){if(state.sub==='vocab')return `<h1>오답</h1>${segment([['reading','진단평가 6'],['vocab','단어 10']],state.sub,'sub')}${block('9월 2회차 · 9/24',`<p>4개 오답 · 재시험 2/4 통과</p><p class="minor">남은 2개를 단어장에서 확인할 수 있어요.</p>${words.slice(0,2).map(w=>`<div class="row"><strong>${w.word}</strong><span class="badge">뜻 쓰기 · 재시험 대기</span><p class="answer"><span class="warn">${w.mine||'미작성'}</span> → ${w.meaning}</p><span class="minor">유의어 ${w.syn} · 반의어 ${w.ant}</span></div>`).join('')}${b('재시험 남은 단어 보기 →','vocab:pending','action')}${fold('통과한 단어 2개','<p>impact · 영향 · 재시험 통과</p><p>approach · 접근법 · 재시험 통과</p>')}`)}${fold('9월 1회차 · 6개 오답','<p>재시험 미응시</p><p>evidence, context, reflect, obtain, improve, concern</p>')}`;return `<h1>${state.page==='type'?'유형별 오답':'오답'}</h1>${state.page==='type'?`${b('분석으로 돌아가기','back-analysis','link')}<p class="badge">9월 · ${state.type==='claim'?'주장 파악':'빈칸 추론'}</p>`:segment([['reading','진단평가 6'],['vocab','단어 10']],state.sub,'sub')}<p class="minor">최근 수업 2문항 · 기간 전체 6문항</p>${block('9월 2회차 · 9/24',q.filter(x=>state.page!=='type'||x.label===(state.type==='claim'?'주장 파악':'빈칸 추론')).map(item=>{const i=q.indexOf(item);return `<div class="row"><span class="badge">${item.number}번 · ${item.label}</span>${opts.questionView==='inline'?questionBody(item):`<p class="stem">${item.stem}</p><p><span class="warn">내 답 ${item.mine}</span> · 정답 ${item.answer}</p>${b('문제·해설 읽기 →','question:'+i,'link')}`}</div>`}).join(''))}${state.page==='type'?'':fold('9월 1회차 · 오답 4문항','<p>빈칸 추론 2문항 · 어법 2문항</p><p class="minor">이 구조 시안의 문제 전문은 최근 회차 2문항을 사용해요.</p>')}`;}
function vocab(){const active=words.filter(w=>(state.mode==='all'||state.mode==='wrong'&&w.mine!==null||state.mode==='pending'&&w.status==='pending'||state.mode==='empty'&&w.mine==='')&&(state.pos==='all'||w.pos===state.pos)&&(state.week==='all'||w.week===state.week)&&(state.passage==='all'||w.passage===state.passage)&&(state.example==='all'||state.example==='yes'&&!!w.ex||state.example==='no'&&!w.ex)&&[w.word,w.meaning,w.syn,w.ant].some(v=>v.toLowerCase().includes(state.search.toLowerCase())));return `<h1>단어장</h1><p class="minor">구조 검토용 4개 중 ${active.length}개 표시</p><label class="search">단어·뜻·유의어·반의어 검색<input id="preserved-search" type="search" value="${escape(state.search)}" placeholder="예: adjust" /></label>${segment([['all','전체'],['wrong','오답'],['pending','재시험 남음'],['empty','미작성']],state.mode,'mode')}${fold('상세 조건', [['week','주차',[['all','전체'],['1','1회차'],['2','2회차']]],['passage','지문',[['all','전체'],['A','A'],['B','B']]],['pos','품사',[['all','전체'],['명사','명사'],['동사','동사'],['형용사','형용사']]],['example','예문',[['all','전체'],['yes','있음'],['no','없음']]]].map(([key,label,values])=>`<label>${label}<select data-filter="${key}">${values.map(([value,text])=>`<option value="${value}" ${state[key]===value?'selected':''}>${text}</option>`).join('')}</select></label>`).join('')+b('조건 초기화','reset','link'),state.week!=='all'||state.pos!=='all'||state.example!=='all'||state.passage!=='all')}<p class="minor">${[state.week!=='all'?state.week+'회차':'',state.pos!=='all'?state.pos:'',state.passage!=='all'?'지문 '+state.passage:'',state.example!=='all'?'예문 '+(state.example==='yes'?'있음':'없음'):''].filter(Boolean).join(' · ')||'추가 조건 없음'}</p>${active.map(w=>block(w.word,`<span class="minor">${w.week}회차 · 지문 ${w.passage} · ${w.pos}</span><p>${w.meaning}</p>${w.mine!==null?`<span class="badge">${w.status==='done'?'재시험 통과':'재시험 대기'}</span><p class="answer"><span class="warn">${w.mine||'미작성'}</span> → ${w.meaning}</p>`:''}<p>유의어 ${w.syn}${w.ant?' · 반의어 '+w.ant:''}</p>${fold('파생어·예문·번역',`<p>${w.der}</p>${w.ex?`<p class="reading" lang="en">${w.ex}</p><p>${w.ko}</p>`:'<p class="minor">등록된 예문 없음</p>'}`,opts.wordDetail)}`)).join('')||'<p>조건에 맞는 단어가 없어요.</p>'}`;}
function render(){const detail=state.page==='question';let body=detail?`${b('← 목록으로','back','link')}<p class="minor">9월 2회차 · ${q[state.question].number}번 · ${q[state.question].label}</p>${questionBody(q[state.question])}${b(state.question===0?'다음 문제 읽기 →':'← 이전 문제 읽기','question:'+(state.question===0?1:0),'action')}`:state.tab==='home'?home():state.tab==='record'?record():state.tab==='analysis'?analysis():state.tab==='wrong'?wrong():vocab();root.innerHTML=`<div class="stamp">정보 배치 검토 · 가상 데이터 · 5탭 유지</div><header><div><div class="minor">고2 · 영어반</div><div class="name">민서</div></div><span class="badge">9월 · 2회차</span></header><main>${body}</main>${detail?'':`<nav aria-label="주요 화면">${[['home','홈','house'],['record','기록','history'],['analysis','분석','chart-no-axes-combined'],['wrong','오답','book-open'],['vocab','단어','languages']].map(([id,label,i])=>b(icon(i)+label,'tab:'+id,'',`aria-current="${state.tab===id?'page':'false'}"`)).join('')}</nav>`}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
root.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const [a,v]=target.dataset.action.split(':');if(a==='tab'){state.tab=v;state.page=null}else if(['metric','scope','att','sub','mode'].includes(a)){state[a]=v}else if(a==='wrong'){state.tab='wrong';state.sub=v;state.page=null}else if(a==='vocab'){state.tab='vocab';state.mode=v;state.page=null}else if(a==='history'||a==='attendance'){state.tab='record';state.page=null;state.recordFocus=a==='history'?Number(v):1}else if(a==='type'){state.tab='wrong';state.sub='reading';state.page='type';state.type=v||'blank'}else if(a==='question'){if(state.page!=='question')state.returnPage=state.page;state.page='question';state.question=Number(v)}else if(a==='back'){state.page=state.returnPage||null}else if(a==='back-analysis'){state.tab='analysis';state.page=null}else if(a==='reset'){Object.assign(state,{mode:'all',search:'',week:'all',pos:'all',passage:'all',example:'all'})}render();save();if(a==='history'){root.querySelectorAll('main .block')[v==='0'?1:0]?.scrollIntoView({block:'start'})}else if(a==='attendance'){root.querySelector('main .block:last-child')?.scrollIntoView({block:'start'})}});
root.addEventListener('change',event=>{if(event.target.dataset.filter){state[event.target.dataset.filter]=event.target.value;render();save()}});
root.addEventListener('input',event=>{if(event.target.id==='preserved-search'){state.search=event.target.value;const start=event.target.selectionStart;render();const input=root.querySelector('#preserved-search');input.focus();try{input.setSelectionRange(start,start)}catch{}save()}});
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){const incoming=event.detail.globals.widgetState;if(JSON.stringify(incoming.privateContent?.state)===JSON.stringify(state)&&JSON.stringify(incoming.privateContent?.options)===JSON.stringify(opts))return;restore(incoming);render()}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save()}});tweak.addSelect(opts,'questionView',{label:'오답 읽기 방식',options:[{label:'목록 → 별도 읽기',value:'list'},{label:'목록에서 전문 읽기',value:'inline'}]});tweak.addToggle(opts,'wordDetail',{label:'단어 학습 정보 기본 펼침'});}
})();
</script>
