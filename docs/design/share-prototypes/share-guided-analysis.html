<div id="edunote-analysis" aria-label="설명과 시각적 근거를 함께 보는 EduNote 분석"></div>
<style>
#edunote-analysis{--bg:light-dark(#fff,#101013);--panel:light-dark(#f9fafb,#17171c);--box:light-dark(#f2f4f6,#29292f);--ink:light-dark(#191f28,#e5e8eb);--muted:light-dark(#6b7684,#a9adb8);--line:light-dark(#e5e8eb,#34343e);--blue:light-dark(#1b64da,#6ba5ff);--red:light-dark(#d22030,#ff7b86);--focus:light-dark(#e8f3ff,#242933);background:var(--bg);color:var(--ink);font:15px/1.65 Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:430px;margin:0 auto;border:1px solid var(--line);border-radius:22px;overflow:clip;word-break:keep-all}
#edunote-analysis *{box-sizing:border-box}#edunote-analysis header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 10px;gap:12px}#edunote-analysis header strong{display:block;font-size:20px;font-weight:800}#edunote-analysis .muted{color:var(--muted);font-size:12px}#edunote-analysis .stamp{font-size:11px;color:var(--muted);padding:6px 18px;background:var(--panel)}#edunote-analysis .period{background:var(--box);padding:6px 12px;border-radius:20px;font-size:13px}#edunote-analysis main{padding:8px 16px 24px;min-height:430px}#edunote-analysis button{font:inherit;border:0;color:inherit;background:transparent;min-height:44px;padding:10px 0;text-align:left}#edunote-analysis button:disabled{opacity:.45}#edunote-analysis h1{font-size:23px;line-height:1.4;letter-spacing:-.5px;margin:10px 0 14px;font-weight:700}#edunote-analysis h2{font-size:16px;margin:0 0 12px;font-weight:800}#edunote-analysis p{margin:0 0 10px}#edunote-analysis .panel{background:var(--panel);border-radius:20px;padding:20px;margin-bottom:12px}#edunote-analysis .kicker{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}#edunote-analysis .row{width:100%;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}#edunote-analysis .row:last-child{border-bottom:0}#edunote-analysis .row .copy{flex:1;min-width:0}#edunote-analysis .row strong{font-size:15px;font-weight:650;display:block}#edunote-analysis .row small{display:block;font-size:12px;color:var(--muted);margin-top:3px}#edunote-analysis .row .arrow{flex-shrink:0;color:var(--muted)}#edunote-analysis .primary{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px;padding:15px 16px;background:var(--focus);border-radius:14px;font-size:15px;font-weight:700;margin-top:16px}#edunote-analysis .primary span small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}#edunote-analysis .link{color:var(--blue);font-size:13px}#edunote-analysis .quiet{width:100%;text-align:center;background:var(--box);border-radius:12px;padding:12px;margin-top:12px}#edunote-analysis .scope{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 14px}#edunote-analysis .scope span{background:var(--box);padding:4px 8px;border-radius:7px}#edunote-analysis .back{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}#edunote-analysis .details{margin-top:10px;border-top:1px solid var(--line)}#edunote-analysis summary{min-height:44px;padding:11px 0;font-size:13px;color:var(--muted)}#edunote-analysis .facts{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:14px;margin:0}#edunote-analysis dt{color:var(--muted)}#edunote-analysis dd{margin:0;font-variant-numeric:tabular-nums}#edunote-analysis .chip{font-size:11px;background:var(--box);padding:3px 7px;border-radius:6px;display:inline-block;margin-bottom:8px}#edunote-analysis .danger{color:var(--red)}#edunote-analysis .segment{display:flex;gap:4px;background:var(--box);border-radius:13px;padding:4px;margin:12px 0 18px}#edunote-analysis .segment button{flex:1;text-align:center;font-size:13px;border-radius:9px;padding:10px 4px}#edunote-analysis .segment button[aria-pressed=true]{background:var(--bg);font-weight:700}#edunote-analysis .stem{font-size:17px;font-weight:700;line-height:1.6;margin:16px 0}#edunote-analysis .passage{font-size:17px;font-weight:400;line-height:1.8;word-break:normal;border-block:1px solid var(--line);padding:18px 0;margin:16px 0}#edunote-analysis .choice{display:flex;gap:10px;width:100%;padding:13px 0;font-size:16px;border-bottom:1px solid var(--line);word-break:normal}#edunote-analysis button.choice[aria-pressed=true]{background:var(--focus);border-radius:10px;padding-inline:10px}#edunote-analysis .feedback{border-left:3px solid var(--line);padding-left:14px;margin:24px 0;font-size:15px;line-height:1.75}#edunote-analysis .twocol{display:flex;gap:10px}#edunote-analysis .twocol>*{flex:1}#edunote-analysis nav{display:flex;gap:4px;border-top:1px solid var(--line);padding:7px 6px 12px}#edunote-analysis nav button{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:11px;gap:5px;color:var(--muted)}#edunote-analysis nav button[aria-current=page]{color:var(--blue);font-weight:700}#edunote-analysis .metric{display:block;width:100%;border-bottom:1px solid var(--line);padding:12px 0;font-size:13px}#edunote-analysis .metric strong{font-size:22px;margin-left:12px}#edunote-analysis .metric small{display:block;font-size:12px;color:var(--muted)}#edunote-analysis .metric[aria-pressed=true]{color:var(--blue)}#edunote-analysis .metric strong{color:var(--ink)}#edunote-analysis .track{height:6px;border-radius:6px;background:var(--box);margin-top:8px}#edunote-analysis .fill{height:100%;border-radius:6px;background:var(--blue)}#edunote-analysis .word{padding:16px 0;border-bottom:1px solid var(--line)}#edunote-analysis .word>strong{font-size:22px;display:block}#edunote-analysis input{width:100%;font:inherit;font-size:16px;min-height:44px;border:1px solid var(--line);color:var(--ink);background:var(--box);border-radius:12px;padding:10px 12px}#edunote-analysis .note{background:var(--box);border-radius:12px;padding:14px;margin-top:14px}#edunote-analysis .note p:last-child{margin-bottom:0}#edunote-analysis .calendar{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:3px;font-size:12px}#edunote-analysis .day{padding:8px 0}#edunote-analysis .att{background:var(--box);border-radius:8px;font-weight:800}
</style>
<style>
#edunote-analysis .evidence-type{padding-bottom:15px}
#edunote-analysis .evidence-type .row{border-bottom:0;padding-bottom:6px}
#edunote-analysis .evidence-type .track{margin-top:2px}
#edunote-analysis .evidence-pattern{border-bottom:1px solid var(--line);padding:14px 0 20px;margin-bottom:10px}
#edunote-analysis .evidence-pattern:last-child{border-bottom:0;margin:0;padding-bottom:0}
#edunote-analysis .evidence-pattern h2{margin-top:8px}
#edunote-analysis .evidence-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:center;margin:16px 0}
#edunote-analysis .evidence-bar-area{height:80px;display:flex;align-items:end;justify-content:center;margin:8px 0;background:var(--box);border-radius:8px}
#edunote-analysis .evidence-bar{width:46%;border-radius:5px 5px 0 0}
</style>

<script>
(()=>{
const root=document.getElementById('edunote-analysis');
const defaults=()=>({view:'analysis',week:'2',kind:'reading',tag:null,q:0,metric:'reading',att:'regular',mode:'all',search:'',practice:false,choice:null,checked:false});
let s=defaults(),stack=[];const design={emphasis:true};
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const b=(text,action,cls='',extra='')=>`<button type="button" data-go="${action}" class="cursor-interaction ${cls}" ${extra}>${text}</button>`;
const row=(title,sub,action)=>b(`<span class="copy"><strong>${title}</strong><small>${sub}</small></span><span class="arrow">${icon('chevron-right')}</span>`,action,'row');
const panel=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;
const scope=()=>`<div class="scope"><span>9월</span>${s.week?`<span>9/${s.week==='2'?'24':'17'} · ${s.week}회차</span>`:'<span>기간 전체</span>'}${s.tag?`<span>${s.tag==='blank'?'빈칸 추론':'주장 파악'}</span>`:''}${s.mode==='pending'?'<span>재시험 남음</span>':''}</div>`;
const segment=(items,selected,prefix)=>`<div class="segment">${items.map(([id,t])=>b(t,`${prefix}:${id}`,'',`aria-pressed="${selected===id}"`)).join('')}</div>`;
const questions=[{id:0,week:'2',tag:'blank',number:3,title:'빈칸에 들어갈 말 고르기',stem:'다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?',text:'Students often focus only on their final score. However, improvement begins when they look closely at why an answer was wrong. Comparing their reasoning with evidence in the passage helps them discover patterns in their mistakes. In this way, mistakes can become ________.',choices:['proof that learning should stop','useful information for future learning','a reason to avoid difficult questions'],mine:2,answer:1,explain:'오답의 원인을 분석하면 이후 학습에 도움이 된다는 내용이에요. “In this way”가 앞의 과정을 받으므로 ②가 알맞아요.'},{id:1,week:'2',tag:'claim',number:7,title:'필자의 주장 찾기',stem:'필자가 주장하는 바로 가장 적절한 것은?',text:'A short study session every day can be more effective than a long session once a week. Returning to the same material gives you repeated chances to recall it. Set aside a small amount of time each day.',choices:['Study a little every day.','Wait until you have several free hours.','Avoid reviewing the same material.'],mine:1,answer:0,explain:'매일 조금씩 공부하라는 마지막 문장이 필자의 주장을 직접 보여 줘요. 따라서 ①이 알맞아요.'},{id:2,week:'1',tag:'blank',number:2,title:'꾸준한 연습의 효과',stem:'빈칸에 들어갈 말로 가장 적절한 것은?',text:'A skill becomes easier with practice. Even a few minutes a day can lead to progress over time. Therefore, regular practice is ________.',choices:['valuable','useless','impossible'],mine:1,answer:0,explain:'반복 연습이 발전으로 이어진다는 내용이므로 valuable이 알맞아요.'}];
const words=[{word:'adapt',meaning:'적응하다',week:'2',status:'pending',mine:'채택하다',syn:'adjust',ex:'We adapt to new environments.'},{word:'maintain',meaning:'유지하다',week:'2',status:'pending',mine:'미작성',syn:'preserve',ex:'Maintain a regular study schedule.'},{word:'impact',meaning:'영향',week:'2',status:'done',mine:'충격을 주다',syn:'effect',ex:'Small changes can have a big impact.'},{word:'approach',meaning:'접근법',week:'2',status:'done',mine:'도착',syn:'method',ex:'Try a different approach.'},{word:'evidence',meaning:'증거',week:'1',status:'pending',mine:'사건',syn:'proof',ex:'Find evidence in the passage.'}];
function restore(w){if(w?.privateContent?.version!==5)return;const p=w.privateContent;s={...defaults(),...p.state};stack=Array.isArray(p.stack)?p.stack.slice(-8):[];Object.assign(design,p.design);}
restore(window.openai?.widgetState);
function save(){window.openai?.setWidgetState({modelContent:{design:'설명과 시각적 근거를 함께 보는 분석',screen:s.view,week:s.week,tag:s.tag,mode:s.mode,emphasizeNext:design.emphasis},privateContent:{version:5,state:s,stack,design}})?.catch(()=>{});}
function home(){return `<section class="panel"><div class="kicker"><span>최근 수업 · 9월 2회차 · 9/24</span><span>출석</span></div><h1>시험·단어<br>둘 다 올랐어요.</h1>${row('시험 8/10 · 80%','직전 +20%p · 반 평균 +10%p','session:2')}${row('단어 16/20 · 80%','직전 +10%p · 반 평균 +6%p','session:2')}${row('과제 5/5 제출','이번 회차 결과 자세히','session:2')}${b(`<span>틀린 2문제 확인하기<small>9월 24일 수업 · 내 답과 해설</small></span>${icon('arrow-right')}`,'latest-reading',design.emphasis?'primary':'row')}</section>${panel('선생님 코멘트',`<p>글의 흐름을 잘 따라가고 있어요. 빈칸 앞뒤 문장에서 근거를 찾는 연습을 해 보세요.</p>${b('빈칸 추론은 얼마나 틀렸을까? →','analysis-blank','link')}<details class="details" data-detail="older-comments"><summary class="cursor-interaction">이전 코멘트 1개</summary><p class="muted">9/17 · 1회차</p><p>오답을 확인할 때 연결어에 표시해 보세요.</p></details>`)}${panel('남은 복습',row('단어 재시험 2개 남음','이번 수업 오답 4개 중 2개 통과','latest-words'))}${panel('9월 요약 · 2회차',metrics())}`;}
function metrics(){const rows=[['reading','시험',70,'+20%p','+5%p'],['vocab','단어',75,'+10%p','+3%p'],['homework','과제',90,'+20%p',null]];const vals=s.metric==='reading'?[60,80]:s.metric==='vocab'?[70,80]:[80,100];const avg=s.metric==='reading'?[60,70]:[70,74];const y=n=>112-n*.8;return `${rows.map(([id,t,val,delta,diff])=>b(`${t}<strong>${val}%</strong><span class="muted"> · 기간 평균</span><small>직전 회차 대비 ${delta}${diff?' · 기간 반 비교 '+diff:''}</small><small>${s.metric===id?'추이 선택됨':'추이 보기'}</small>`,'metric:'+id,'metric',`aria-pressed="${s.metric===id}"`)).join('')}<svg width="100%" height="144" role="img" aria-label="회차별 ${s.metric==='homework'?'제출률':'정답률'}: ${vals.join('%, ')}%"><line x1="15%" x2="85%" y1="112" y2="112" stroke="var(--line)"/>${s.metric==='homework'?'':`<line x1="18%" x2="82%" y1="${y(avg[0])}" y2="${y(avg[1])}" stroke="var(--muted)" stroke-dasharray="4 4"/>`}<line x1="18%" x2="82%" y1="${y(vals[0])}" y2="${y(vals[1])}" stroke="var(--blue)" stroke-width="2.5"/>${vals.map((v,i)=>`<circle cx="${i?82:18}%" cy="${y(v)}" r="4" fill="var(--blue)"/><text x="${i?82:18}%" y="${y(v)-12}" text-anchor="middle" fill="var(--ink)" font-size="14">${v}%</text><text x="${i?82:18}%" y="136" text-anchor="middle" fill="var(--muted)" font-size="12">9/${i?24:17}</text>`).join('')}</svg><p class="muted">실선: 내 결과${s.metric==='homework'?'':' · 점선: 반 평균'}</p><div class="twocol">${b('9/17 기록 →','session:1','link')}${b('9/24 기록 →','session:2','link')}</div>${row('정규수업 2/2 출석','연속 2회 출석 · 출결 자세히','attendance:regular')}${row('클리닉 1회 결석','9/26 · 해당 출결 확인','attendance:clinic')}`;}
function session(){const latest=s.week==='2';return `<h1>수업 결과</h1>${scope()}${panel('점수와 과제',`<dl class="facts"><dt>시험</dt><dd>${latest?'8':'6'}/10 · 반 ${latest?'+10':'0'}%p</dd><dt>단어</dt><dd>${latest?'16':'14'}/20 · 반 ${latest?'+6':'0'}%p</dd><dt>과제</dt><dd>${latest?'5/5 제출':'4/5 · 1개 미제출'}</dd><dt>재시험</dt><dd>${latest?'2/4 통과':'아직 응시하지 않음'}</dd><dt>출결</dt><dd>출석</dd></dl>`)}${panel('선생님 코멘트',`<p>${latest?'빈칸 앞뒤에서 근거를 찾는 연습을 해 보세요.':'연결어에 표시해 보세요.'}</p>`)}${row(latest?'이 수업 오답 2문항':'이 수업 오답 4문항',latest?'빈칸 추론 · 주장 파악':'빈칸 추론 · 어법','session-reading')}${row('이 수업의 틀린 단어','입력한 답·정답·재시험 상태','session-words')}`;}
const matching=()=>questions.filter(q=>(!s.week||q.week===s.week)&&(!s.tag||q.tag===s.tag));
function list(){const list=matching();return `<h1>${s.tag?'유형별 오답':'수업 오답'}</h1>${scope()}<p class="muted">${s.week==='2'&&!s.tag?'2문항':`전문 샘플 ${list.length}문항`}</p>${list.map(q=>row(`${q.number}번 · ${q.tag==='blank'?'빈칸 추론':'주장 파악'}`,`${q.title} · 내 답 ${q.mine+1} → 정답 ${q.answer+1}`,'question:'+q.id)).join('')}${s.week!=='2'?'<p class="muted" style="margin-top:16px">과거 문항 전문은 일부 샘플로 체험할 수 있어요.</p>':''}`;}
function question(){const q=questions[s.q],list=matching(),idx=list.findIndex(x=>x.id===q.id),next=list[idx+1];return `${scope()}<span class="chip">${q.number}번 · ${s.practice?'다시 풀기':'문제·해설 읽기'}</span><p class="stem">${q.stem}</p><p class="passage" lang="en">${q.text}</p>${q.choices.map((c,i)=>s.practice?b(`<span>${i+1}</span><span>${c}</span>`,'choice:'+i,'choice',`aria-pressed="${s.choice===i}" ${s.checked?'disabled':''}`):`<div class="choice"><span>${i+1}</span><span>${c}</span></div>`).join('')}${!s.practice||s.checked?`<section class="feedback" aria-live="polite"><h2>${s.practice?(s.choice===q.answer?'맞았어요':'근거를 다시 살펴보세요'):`내 답 ${q.mine+1} · 정답 ${q.answer+1}`}</h2><p>${q.explain}</p><p class="muted">선생님 첨삭</p><p>정답의 근거가 되는 문장에 표시해 보세요.</p></section>`:''}${s.practice?(s.checked?b('해설 읽기로 돌아가기','exit-practice','quiet'):b('정답 확인','check','quiet',s.choice===null?'disabled':'')):b('이 문제 다시 풀기','practice','quiet')}${s.practice?'<p class="muted" style="margin-top:8px">개인 복습 체험 · 성적에 저장되지 않아요.</p>':''}<div class="twocol">${idx>0?b('← 이전 문제','next:'+list[idx-1].id,'link'):''}${next?b('다음 문제 →','next:'+next.id,'link'):b('목록으로 돌아가기','back','link')}</div>`;}
function analysis(){
const typeRows=[['빈칸 추론',3,5,'type-questions'],['어법',2,5,null],['주장 파악',1,5,'claim-questions'],['내용 일치',0,5,null]];
const bars=typeRows.map(([name,wrong,total,action])=>{const rate=Math.round(wrong/total*100);const content=`<span class="copy"><strong>${name}</strong><small>${wrong}/${total}문항 오답</small></span><span>${rate}%</span>${action?`<span class="arrow">${icon('chevron-right')}</span>`:''}`;return `<div class="evidence-type">${action?b(content,action,'row'):`<div class="row">${content}</div>`}<div class="track" role="img" aria-label="${name} 오답률 ${rate}%, ${total}문항 중 ${wrong}문항"><div class="fill" style="width:${rate}%;background:${rate>=50?'var(--red)':'var(--muted)'}"></div></div></div>`}).join('');
const trend=(name,correct,totals,status,action)=>`<section class="evidence-pattern"><div class="kicker"><span>${status}</span><span>회차별 정답률</span></div><h2>${name}</h2><div class="evidence-columns">${correct.map((v,i)=>{const rate=Math.round(v/totals[i]*100);return `<div><span class="muted">${v}/${totals[i]} 정답 · ${rate}%</span><div class="evidence-bar-area"><div class="evidence-bar" style="height:${rate}%;background:${i?'var(--blue)':'var(--muted)'}"></div></div><span class="muted">${i?'9/24':'9/17'}</span></div>`}).join('')}</div><p class="muted">${name==='빈칸 추론'?'0% → 67%로 올랐지만, 최근 수업에서도 1문항을 틀렸어요.':'100% → 67%로 내려갔어요. 최근 수업의 오답 1문항을 확인해 보세요.'}</p>${b('관련 오답 확인하기 →',action,'link')}</section>`;
return `<h1>어디부터 확인할까요?</h1><div class="scope"><span>9월 · 2회차 누적</span><span>20문항</span></div>${panel('먼저 살펴볼 유형',`<span class="muted">기간 내 오답이 가장 많은 유형</span><h1>빈칸 추론<br>5문항 중 3문항 오답</h1><p>직전보다 나아졌지만,<br>이번에도 오답이 남았어요.</p>${b('빈칸 추론 오답 확인하기 →','type-questions','primary')}`)}${panel('유형별로 비교하기',`<p class="muted">막대는 오답률 · 숫자는 오답/출제 수</p>${bars}`)}${panel('회차별로 어떻게 달라졌나요?',trend('빈칸 추론',[0,2],[2,3],'개선','type-questions')+trend('주장 파악',[2,2],[2,3],'악화','claim-questions'))}${panel('영역별 전체 결과',`<p class="muted">정답률 기준 · 값이 높을수록 많이 맞혔어요.</p>${[['이해',90,'주장 파악·내용 일치'],['추론',40,'빈칸 추론'],['어법',60,'문장 구조']].map(([name,rate,desc])=>`<div class="evidence-type"><div class="row"><span class="copy"><strong>${name}</strong><small>${desc}</small></span><span>${rate}%</span></div><div class="track"><div class="fill" style="width:${rate}%"></div></div></div>`).join('')}`)}`;
}
function vocab(){const list=words.filter(w=>(!s.week||w.week===s.week)&&(s.mode!=='pending'||w.status==='pending')&&[w.word,w.meaning,w.syn].some(x=>x.toLowerCase().includes(s.search.toLowerCase())));return `<h1>${s.mode==='pending'?'재시험이 남은 단어':'수업 단어장'}</h1>${scope()}${segment([['all','전체 오답'],['pending','재시험 남음']],s.mode,'mode')}<label><span class="muted">단어·뜻·유의어 검색</span><input id="guided-search" value="${s.search.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}" placeholder="예: adapt" /></label><p class="muted" style="margin-top:10px">${list.length}개 표시</p>${list.map(w=>`<section class="word"><span class="chip">${w.week}회차 · ${w.status==='done'?'재시험 통과':'재시험 대기'}</span><strong>${w.word}</strong><p>${w.meaning}</p><p class="muted">내 답 ${w.mine} → ${w.meaning}</p><details data-detail="${w.word}"><summary class="cursor-interaction">유의어·예문</summary><p>유의어 ${w.syn}</p><p lang="en">${w.ex}</p></details></section>`).join('')||'<p>조건에 맞는 단어가 없어요.</p>'}`;}
function attendance(){return `<h1>출결 기록</h1><div class="scope"><span>9월</span></div>${segment([['regular','정규수업'],['clinic','클리닉']],s.att,'att')}${panel(s.att==='clinic'?'클리닉 1/2 출석':'정규수업 2/2 출석',s.att==='clinic'?'<p class="danger">9월 26일 · 결석</p><p>9월 19일 · 출석</p>':'<p>9월 24일 · 출석</p><p>9월 17일 · 출석</p>')}<h2>2026년 9월</h2><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<span class="muted">${x}</span>`).join('')}<span></span><span></span>${Array.from({length:30},(_,i)=>`<span class="day ${s.att==='regular'&&[17,24].includes(i+1)||s.att==='clinic'&&i+1===19?'att':s.att==='clinic'&&i+1===26?'danger':''}">${i+1}${s.att==='clinic'&&i+1===26?'×':''}</span>`).join('')}</div><p class="muted">배경 있는 날짜: 출석 · ×: 결석</p>`;}
function history(){return `<h1>회차별 기록</h1><p class="muted">9월 · 2회차</p>${row('9/24 · 2회차','시험 8/10 · 단어 16/20 · 과제 5/5','session:2')}${row('9/17 · 1회차','시험 6/10 · 단어 14/20 · 과제 4/5','session:1')}${row('정규·클리닉 출결','정규 2/2 · 클리닉 1/2','attendance:regular')}`;}
function render(openKeys=[]){const views={home,session,list,question,analysis,vocab,attendance,history};const tab=['session','attendance','history'].includes(s.view)?'history':['list','question'].includes(s.view)?'list':s.view;root.innerHTML=`<div class="stamp">분석 보완 시안 · 가상 데이터</div><header><div><span class="muted">고2 · 영어반</span><strong>민서</strong></div><span class="period">9월</span></header><main>${stack.length?b(icon('chevron-left')+'이전 화면','back','back'):''}${(views[s.view]||home)()}</main>${s.view==='question'?'':`<nav aria-label="주요 화면">${[['home','홈','house'],['history','기록','history'],['analysis','분석','chart-no-axes-combined'],['list','오답','book-open'],['vocab','단어','languages']].map(([id,title,i])=>b(icon(i)+title,'tab:'+id,'',`aria-current="${tab===id?'page':'false'}"`)).join('')}</nav>`}`;for(const key of openKeys){const el=[...root.querySelectorAll('details[data-detail]')].find(el=>el.dataset.detail===key);if(el)el.open=true}if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
function push(action){stack.push({state:{...s},anchor:action,open:[...root.querySelectorAll('details[open][data-detail]')].map(x=>x.dataset.detail)});if(stack.length>8)stack.shift();}
root.addEventListener('click',e=>{const target=e.target.closest('[data-go]');if(!target||target.disabled)return;const action=target.dataset.go;const [a,v]=action.split(':');let restorePoint=null;const local=['metric','att','mode','choice','check','practice','exit-practice','next'].includes(a);if(a==='back'){const previous=stack.pop();if(!previous)return;s={...previous.state};restorePoint=previous}else if(a==='tab'){stack=[];s={...defaults(),view:v,week:null}}else{if(!local)push(action);if(a==='session'){s.view='session';s.week=v;s.tag=null;s.mode='all'}else if(a==='latest-reading'||a==='session-reading'){s.view='list';if(a==='latest-reading')s.week='2';s.tag=null;s.mode='all'}else if(a==='latest-words'||a==='session-words'){s.view='vocab';if(a==='latest-words')s.week='2';s.mode=a==='latest-words'?'pending':'all';s.search='';s.tag=null}else if(a==='analysis-blank'){s.view='analysis';s.week=null;s.tag=null;s.mode='all'}else if(a==='type-questions'||a==='claim-questions'){s.view='list';s.week=null;s.tag=a==='type-questions'?'blank':'claim';s.mode='all'}else if(a==='question'||a==='next'){s.view='question';s.q=Number(v);s.practice=false;s.choice=null;s.checked=false}else if(a==='attendance'){s.view='attendance';s.att=v;s.week=null;s.tag=null}else if(a==='practice'){s.practice=true;s.choice=null;s.checked=false}else if(a==='exit-practice'){s.practice=false}else if(a==='choice'){s.choice=Number(v)}else if(a==='check'){s.checked=true}else if(['metric','att','mode'].includes(a)){s[a]=v}}render(restorePoint?.open);save();if(restorePoint){const el=[...root.querySelectorAll('[data-go]')].find(el=>el.dataset.go===restorePoint.anchor);el?.focus({preventScroll:true});el?.scrollIntoView({block:'nearest'})}else if(!local){root.querySelector('header')?.scrollIntoView({block:'start'})}else{[...root.querySelectorAll('[data-go]')].find(el=>el.dataset.go===action)?.focus({preventScroll:true})}});
root.addEventListener('input',e=>{if(e.target.id!=='guided-search')return;s.search=e.target.value;const caret=e.target.selectionStart;render();const el=root.querySelector('#guided-search');el.focus();el.setSelectionRange(caret,caret);save()});
window.addEventListener('openai:set_globals',e=>{const w=e.detail?.globals?.widgetState;if(!w||JSON.stringify(w.privateContent?.state)===JSON.stringify(s))return;restore(w);render()});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save()}});tweak.addToggle(design,'emphasis',{label:'홈 첫 행동 강조'});}
})();
</script>
