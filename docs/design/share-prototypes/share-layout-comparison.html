<div id="edunote-compare" aria-label="EduNote 모바일 구성 비교"></div>
<style>
#edunote-compare{--paper:light-dark(#fff,#17171c);--surface:light-dark(#f2f4f6,#2a2a33);--ink:light-dark(#191f28,#e5e8eb);--sub:light-dark(#6b7684,#a9adb8);--line:light-dark(#e5e8eb,#34343e);--blue:light-dark(#1b64da,#8dbbff);--soft:light-dark(#edf4ff,#202f49);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);max-width:430px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:clip;line-height:1.55;font-size:16px}
#edunote-compare *{box-sizing:border-box}#edunote-compare button{font:inherit;color:inherit;min-height:44px;border:0;background:transparent;padding:10px 12px;text-align:left}#edunote-compare button:disabled{opacity:.5;cursor:not-allowed}#edunote-compare .sample{padding:9px 20px;background:var(--surface);color:var(--sub);font-size:12px;display:flex;justify-content:space-between;gap:8px}#edunote-compare header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;gap:8px}#edunote-compare .name{font-size:18px;font-weight:700}#edunote-compare .small{font-size:13px;color:var(--sub)}#edunote-compare .period{position:relative}#edunote-compare .pill{display:inline-flex;align-items:center;gap:6px;border-radius:24px;background:var(--surface);white-space:nowrap;font-size:14px}#edunote-compare .menu{position:absolute;top:50px;right:0;z-index:5;width:184px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 10px 28px light-dark(#191f2820,#00000060);padding:6px}#edunote-compare .menu button{display:block;width:100%;border-radius:10px}#edunote-compare .menu button[aria-pressed=true]{background:var(--soft);color:var(--blue)}#edunote-compare main{padding:16px 20px 26px;min-height:440px}#edunote-compare h1{font-size:25px;line-height:1.4;letter-spacing:-.7px;margin:8px 0 18px;font-weight:700}#edunote-compare h2{font-size:18px;line-height:1.5;margin:0 0 12px;font-weight:650}#edunote-compare p{margin:0 0 12px}#edunote-compare .box{padding:20px;background:var(--surface);border-radius:20px;margin-bottom:18px}#edunote-compare .section{padding:20px 0;border-top:1px solid var(--line)}#edunote-compare .metrics{display:flex;gap:32px;margin:20px 0 24px}#edunote-compare .number{font-size:27px;letter-spacing:-.5px;font-weight:700;display:block}#edunote-compare .unit{font-size:14px;font-weight:400;color:var(--sub)}#edunote-compare .primary{display:block;text-align:center;width:100%;background:light-dark(#1b64da,#1b64da);color:light-dark(#fff,#fff);border-radius:14px;font-weight:600;margin-top:16px;min-height:52px}#edunote-compare .link{color:var(--blue);padding-left:0;font-size:15px}#edunote-compare .row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:17px 0;border-bottom:1px solid var(--line)}#edunote-compare .row strong{display:block;font-size:16px;font-weight:600}#edunote-compare .row .small{display:block;margin-top:4px}#edunote-compare .chevron{flex-shrink:0;color:var(--sub)}#edunote-compare .segment{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:14px;margin-bottom:24px}#edunote-compare .segment button{flex:1;text-align:center;font-size:14px;border-radius:10px}#edunote-compare .segment button[aria-pressed=true]{background:var(--paper);font-weight:600}#edunote-compare nav{display:flex;border-top:1px solid var(--line);padding:6px 8px 12px}#edunote-compare nav button{flex:1;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--sub);padding:8px 2px}#edunote-compare nav button[aria-current=page]{color:var(--blue);font-weight:650}#edunote-compare .back{padding-left:0;display:flex;align-items:center;gap:5px;font-size:14px}#edunote-compare .stem{font-size:18px;font-weight:650;margin:18px 0}#edunote-compare .passage{font-size:16px;line-height:1.8;margin:20px 0;word-break:normal;overflow-wrap:break-word}#edunote-compare .choice{display:flex;gap:10px;border:1px solid var(--line);border-radius:13px;padding:14px;width:100%;margin:8px 0;line-height:1.6;font-size:16px}#edunote-compare .choice[aria-pressed=true]{background:var(--soft);border-color:var(--blue);color:var(--blue)}#edunote-compare .explain{padding:18px;background:var(--soft);border-radius:16px;margin-top:22px;font-size:15px;line-height:1.75}#edunote-compare .explain strong{display:block;margin-bottom:8px}#edunote-compare .trend{display:flex;align-items:end;height:100px;gap:20px;margin:18px 0 42px}#edunote-compare .bar{flex:1;position:relative;background:var(--soft);border-radius:8px 8px 0 0;text-align:center;color:var(--ink);min-height:34px;padding-top:5px;font-size:13px}#edunote-compare .bar:last-child{background:var(--blue);color:var(--paper)}#edunote-compare .bar span{position:absolute;top:100%;left:0;right:0;padding-top:8px;color:var(--sub)}
</style>
<script>
(()=>{
const root=document.getElementById('edunote-compare');
const config={layout:'B'};
const fresh=()=>({page:'home',period:'9',group:'questions',history:'sessions',detail:null,practice:false,choice:null,checked:false,menu:false,meaning:false});
let s=fresh();
const data={'9':{date:'9월 24일',score:8,word:16,questions:['빈칸에 들어갈 말 고르기','글의 핵심 주장 찾기'],words:['adapt','evidence','impact','maintain']},'8':{date:'8월 27일',score:6,word:14,questions:['글의 핵심 주장 찾기','빈칸에 들어갈 말 고르기'],words:['approach','context','reflect','reliable']}};
const fixtures=[{type:'빈칸 추론',stem:'다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?',passage:'When students receive feedback, they often focus only on the final score. However, real improvement begins when they look closely at why an answer was wrong. By comparing their reasoning with the evidence in the passage, they can discover a pattern in their mistakes. In this way, mistakes can become ________.',choices:['proof that learning should stop','useful information for future learning','a reason to avoid difficult questions'],answer:1,explain:'점수보다 오답의 이유를 살펴볼 때 실력이 향상된다는 내용이에요. 마지막 문장의 “In this way”는 앞에서 설명한 학습 과정을 받아요. 따라서 실수는 이후 학습에 도움이 되는 정보가 된다는 ②가 알맞아요.'},{type:'주장 파악',stem:'다음 글에서 필자가 주장하는 바로 가장 적절한 것은?',passage:'A short study session every day can be more effective than a long session once a week. Returning to the same material gives the brain repeated chances to recall it. Instead of waiting until you have several free hours, set aside a small amount of time each day.',choices:['Study a little every day.','Always study for several hours.','Avoid reviewing the same material.'],answer:0,explain:'매일 짧게 공부하고 반복해서 떠올리는 것이 효과적이라고 설명해요. “set aside a small amount of time each day”가 주장을 직접 보여 주므로 ①이 알맞아요.'}];
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(text,action,cls='',extra='')=>`<button type="button" class="cursor-interaction ${cls}" data-do="${action}" ${extra}>${text}</button>`;
const row=(title,sub,action)=>button(`<span><strong>${title}</strong><span class="small">${sub}</span></span><span class="chevron">${icon('chevron-right')}</span>`,action,'row');
function restore(saved){const p=saved?.privateContent;if(!p||p.version!==1)return;config.layout=p.layout==='A'?'A':'B';s={...fresh(),...p.state};s.period=s.period==='8'?'8':'9';s.menu=false;}
restore(window.openai?.widgetState);
function save(){window.openai?.setWidgetState({modelContent:{comparison:config.layout==='A'?'A · 기존 5탭 개선':'B · 요약·복습·기록',screen:s.detail!==null?(s.practice?'다시 풀기':'문제 읽기'):s.page,period:s.period+'월'},privateContent:{version:1,layout:config.layout,state:{...s,menu:false}}})?.catch(()=>{});}
function list(){const d=data[s.period];if(s.group==='words')return `<h1>단어 복습</h1><p class="small">${d.date} · 틀린 단어 중 4개 미리보기</p>${d.words.map(w=>`<div class="row"><strong>${w}</strong><span class="small">${s.meaning?({'adapt':'적응하다','evidence':'증거','impact':'영향','maintain':'유지하다','approach':'접근법','context':'맥락','reflect':'반영하다','reliable':'믿을 만한'}[w]):'뜻 가림'}</span></div>`).join('')}${button(s.meaning?'뜻 가리기':'뜻 확인하기','meaning','primary')}`;return `<h1>다시 살펴볼 문제</h1><p class="small">${d.date} · 최근 수업 오답 중 2문제 미리보기</p>${d.questions.map((q,i)=>row(q,`${d.date} · ${i+1}번 · ${q.includes('빈칸')?'빈칸 추론':'주장 파악'}`,'question:'+i)).join('')}`;}
function home(){const d=data[s.period];const metrics=`<div class="metrics"><div><span class="small">독해 정답</span><strong class="number">${d.score}<span class="unit"> / 10</span></strong></div><div><span class="small">단어 정답</span><strong class="number">${d.word}<span class="unit"> / 20</span></strong></div></div>`;const title=s.period==='9'?'독해 10문제 중<br>8문제를 맞혔어요':'독해 10문제 중<br>6문제를 맞혔어요';return `<p class="small">${d.date} · 최근 수업</p><h1>${title}</h1>${config.layout==='A'?`<div class="box">${metrics}<p class="small">${s.period}월 최근 수업 결과</p></div>`:metrics}<div class="${config.layout==='A'?'box':'section'}"><h2>틀린 이유를 확인해 볼까요?</h2><p class="small">먼저 지문의 근거를 찾아보세요.</p>${button('오답 보기','review','primary')}</div><div class="${config.layout==='A'?'box':'section'}"><h2>선생님 코멘트</h2><p>글의 흐름을 잘 따라가고 있어요. 빈칸 앞뒤 문장에서 근거를 찾는 연습을 해 보세요.</p></div>${button('이전 수업과 변화 보기 '+icon('arrow-right'),'history','link')}`;}
function history(){const d=data[s.period];let content=s.history==='sessions'?`<h1>수업 기록</h1>${row(d.date+' 수업',`독해 ${d.score}/10 · 단어 ${d.word}/20`,'session')}${row(s.period==='9'?'9월 17일 수업':'8월 20일 수업','독해 6/10 · 단어 14/20','older')}`:`<h1>학습 변화</h1><p>최근 두 수업의 독해 정답률</p><div class="trend" role="img" aria-label="이전 수업 60%, 최근 수업 ${d.score*10}%"><div class="bar" style="height:60%">60%<span>이전 수업</span></div><div class="bar" style="height:${d.score*10}%">${d.score*10}%<span>최근 수업</span></div></div><div class="section"><h2>복습할 유형</h2>${row('빈칸 추론','최근 수업 문제 확인','weakness')}</div>`;if(config.layout==='B')content=`<div class="segment">${button('회차별','sessions','','aria-pressed="'+(s.history==='sessions')+'"')}${button('변화·유형','trends','','aria-pressed="'+(s.history==='trends')+'"')}</div>`+content;return content;}
function detail(){const q=fixtures[s.detail];return `${button(icon('chevron-left')+(s.practice?'문제 보기':'목록으로'),s.practice?'exit-practice':'back','back')}<p class="small">${data[s.period].date} · ${q.type}${s.practice?' · 다시 풀기':''}</p><div class="stem">${q.stem}</div><p class="passage" lang="en">${q.passage}</p>${q.choices.map((c,i)=>s.practice?button(`<span>${['①','②','③'][i]}</span><span>${c}</span>`,'choice:'+i,'choice',`aria-pressed="${s.choice===i}" ${s.checked?'disabled':''}`):`<div class="choice"><span>${['①','②','③'][i]}</span><span>${c}</span></div>`).join('')}${!s.practice||s.checked?`<div class="explain" aria-live="polite"><strong>${s.practice?(s.choice===q.answer?'맞았어요':'근거를 다시 확인해 보세요'):'내 답 ③ · 정답 '+['①','②','③'][q.answer]}</strong>${q.explain}</div>`:''}${s.practice?(s.checked?button('문제 보기로 돌아가기','exit-practice','primary'):button('정답 확인','check','primary',s.choice===null?'disabled':'')):button('이 문제 다시 풀기','practice','primary')}${s.practice?'<p class="small" style="margin-top:12px">시안 체험 · 실제 성적에 저장되지 않아요</p>':''}`;}
function render(){const d=data[s.period];let content=s.detail!==null?detail():s.page==='home'?home():s.page==='review'?`${config.layout==='B'?`<div class="segment">${button('문제','questions','','aria-pressed="'+(s.group==='questions')+'"')}${button('단어','words','','aria-pressed="'+(s.group==='words')+'"')}</div>`:''}${list()}`:s.page==='session'?`${button(icon('chevron-left')+'수업 기록','history','back')}<h1>${s.older?(s.period==='9'?'9월 17일':'8월 20일'):d.date} 수업</h1><div class="box"><h2>독해 ${s.older?6:d.score}/10 · 단어 ${s.older?14:d.word}/20</h2><p>지문의 연결어와 핵심 문장 찾기를 연습했어요.</p></div>${s.older?'<p class="small">이전 수업은 결과 요약만 제공하는 시안이에요.</p>':button('이 수업 오답 보기','review','primary')}`:history();const tabs=config.layout==='B'?[['home','요약','house'],['review','복습','book-open'],['history','기록','chart-no-axes-combined']]:[['home','홈','house'],['history','기록','calendar-days'],['analysis','분석','chart-no-axes-combined'],['review','오답','book-open'],['vocab','단어','languages']];root.innerHTML=`<div class="sample"><span>가상 학습 데이터</span><span>${config.layout==='A'?'A · 기존 5탭 개선':'B · 요약·복습·기록'}</span></div><header><div><div class="name">민서의 학습 리포트</div><div class="small">고등 영어 · EduNote</div></div><div class="period">${button(s.period+'월 '+icon('chevron-down'),'period','pill',`aria-expanded="${s.menu}" aria-label="조회 기간 ${s.period}월"`)}${s.menu?`<div class="menu" aria-label="조회 기간">${['9','8'].map(p=>button('2026년 '+p+'월','period:'+p,'',`aria-pressed="${s.period===p}"`)).join('')}</div>`:''}</div></header><main>${content}</main>${s.detail!==null?'':`<nav aria-label="주요 화면">${tabs.map(([key,label,ico])=>button(icon(ico)+label,'tab:'+key,'',`aria-current="${(key==='vocab'?s.page==='review'&&s.group==='words':key==='review'?s.page==='review'&&(config.layout==='B'||s.group==='questions'):key==='analysis'?s.page==='analysis':s.page===key)?'page':'false'}"`)).join('')}</nav>`}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
root.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b||b.disabled)return;const [a,v]=b.dataset.do.split(':');if(a==='period'){if(v){s.period=v;s.detail=null;s.practice=false;s.page='home';s.menu=false}else s.menu=!s.menu}else if(a==='tab'){s.detail=null;s.practice=false;s.page=v==='vocab'?'review':v;s.group=v==='vocab'?'words':'questions';s.history=v==='analysis'?'trends':'sessions'}else if(a==='review'){s.page='review';s.group='questions';s.detail=null}else if(a==='history'){s.page='history';s.history='sessions';s.detail=null}else if(a==='questions'||a==='words'){s.group=a;s.meaning=false}else if(a==='sessions'||a==='trends'){s.history=a}else if(a==='question'){const q=data[s.period].questions[Number(v)];s.detail=q.includes('빈칸')?0:1;s.practice=false}else if(a==='back'){s.detail=null}else if(a==='practice'){s.practice=true;s.choice=null;s.checked=false}else if(a==='exit-practice'){s.practice=false}else if(a==='choice'){s.choice=Number(v)}else if(a==='check'){s.checked=true}else if(a==='meaning'){s.meaning=!s.meaning}else if(a==='session'||a==='older'){s.page='session';s.older=a==='older'}else if(a==='weakness'){s.page='review';s.group='questions';s.detail=0}render();if(a!=='period'||v)save();if(a==='period'&&!v)root.querySelector('.menu button')?.focus();else if(a==='choice')root.querySelector(`[data-do="choice:${v}"]`)?.focus();else if(a==='check')root.querySelector('.primary[data-do="exit-practice"]')?.focus();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.menu){s.menu=false;render();root.querySelector('[data-do="period"]')?.focus()}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render()}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{s=fresh();render();save()}});tweak.addSelect(config,'layout',{label:'화면 구성',options:[{label:'A · 기존 5탭 개선',value:'A'},{label:'B · 요약·복습·기록',value:'B'}]});}
})();
</script>
