<div id="edunote-reader" aria-label="EduNote 리포트와 집중 읽기"></div>
<style>
#edunote-reader{--canvas:light-dark(#fff,#101013);--panel:light-dark(#f9fafb,#17171c);--box:light-dark(#f2f4f6,#29292f);--ink:light-dark(#191f28,#e5e8eb);--muted:light-dark(#6b7684,#a9adb8);--line:light-dark(#e5e8eb,#34343e);--accent:light-dark(#1b64da,#6ba5ff);--danger:light-dark(#d22030,#ff7b86);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.65;color:var(--ink);background:var(--canvas);max-width:430px;margin:0 auto;border:1px solid var(--line);border-radius:20px;overflow:clip;word-break:keep-all}

order-top:1px solid var(--line);padding:6px 6px 12px}#edunote-reader nav button{flex:1;text-align:center;color:var(--muted);font-size:12px;display:flex;align-items:center;flex-direction:column;gap:4px}#edunote-reader nav button[aria-current=page]{color:var(--accent);font-weight:800}#edunote-reader .reading{font-size:16px;line-height:1.75;font-weight:400;word-break:normal;overflow-wrap:break-word;padding:16px 0;border-top:1px solid var(--line)}#edunote-reader .stem{font-size:17px;line-height:1.6;font-weight:700;margin:16px 0}#edunote-reader .answer{font-size:15px;padding:12px 0}#edunote-reader .barrow{margin:14px 0}#edunote-reader .barlabel{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}#edunote-reader .track{height:7px;background:var(--box);border-radius:7px;margin:6px 0}#edunote-reader .fill{height:100%;background:var(--accent);border-radius:7px}#edunote-reader .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px;margin-top:12px}#edunote-reader .day{padding:5px 0;border-radius:6px}#edunote-reader .day.present{background:var(--box);font-weight:800}#edunote-reader .day.absent{color:var(--danger);font-weight:800}#edunote-reader .metric{display:block;width:100%;border-bottom:1px solid var(--line);padding:12px 0}#edunote-reader .metric strong{font-size:20px;margin-left:14px}#edunote-reader .metric small{display:block;font-size:12px;color:var(--muted)}#edunote-reader .graph{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}#edunote-reader .point{background:var(--box);border-radius:12px;text-align:center;padding:12px;font-variant-numeric:tabular-nums}#edunote-reader .point strong{display:block;font-size:20px}#edunote-reader .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}#edunote-reader input,#edunote-reader select{font:inherit;color:var(--ink);background:var(--box);border:1px solid var(--line);border-radius:12px;min-height:44px;width:100%;padding:9px 12px}#edunote-reader label{display:block;margin:8px 0;font-size:13px}#edunote-reader .search{margin:12px 0}#edunote-reader .action{width:100%;text-align:center;background:var(--box);border-radius:14px;padding:12px;margin-top:12px;font-weight:700}#edunote-reader .note{padding:14px;background:var(--box);border-radius:14px;margin:14px 0}#edunote-reader .paper{background:light-dark(#fff,#fff);color:light-dark(#191f28,#191f28);border:1px solid var(--line);padding:16px;font-family:Georgia,serif;word-break:normal;font-size:15px}

<style>
#edunote-reader{border-radius:24px;--gap:24px;font-size:15px;letter-spacing:-.2px}
#edunote-reader .stamp{font-size:11px;letter-spacing:.5px;padding:6px 20px;background:var(--canvas)}
#edunote-reader header{padding:10px 20px 14px;border-bottom:1px solid var(--line)}
#edunote-reader header .name{font-size:18px}#edunote-reader header .minor{font-size:11px}
#edunote-reader main{padding:16px 20px 24px;min-height:440px}
#edunote-reader h1{font-size:28px;letter-spacing:-1px;line-height:1.35;margin:12px 0 20px}
#edunote-reader h2{font-size:17px;letter-spacing:-.4px}
#edunote-reader .eyebrow{font-size:12px;font-weight:600;color:var(--muted)}
#edunote-reader .segment{background:transparent;border-radius:0;border-bottom:1px solid var(--line);gap:20px;padding:0;margin-bottom:24px}
#edunote-reader .segment button{border-radius:0;flex:0 1 auto;padding:10px 0 12px;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
#edunote-reader .segment button[aria-pressed=true]{background:transparent;border-color:var(--ink);color:var(--ink);font-weight:700}
#edunote-reader .report-heading{position:relative;padding:2px 0}
#edunote-reader .attendance-mark{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);position:absolute;top:2px;right:0}
#edunote-reader .score-strip{display:grid;grid-template-columns:1fr 1fr 1fr;margin:4px 0 16px;gap:8px}
#edunote-reader .score-strip>div{border-right:1px solid var(--line);padding-right:4px}
#edunote-reader .score-strip>div:last-child{border:0}
#edunote-reader .score-strip span{display:block;font-size:13px;color:var(--muted)}
#edunote-reader .score-strip strong{display:block;font-size:30px;font-weight:700;line-height:1.4;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:6px 0}
#edunote-reader .score-strip small{font-size:14px;font-weight:400;color:var(--muted);margin-left:3px;letter-spacing:0}
#edunote-reader .score-strip em{font-style:normal;font-size:11px;color:var(--muted);display:block}
#edunote-reader .comparison{padding:0;margin:0;border:0;background:var(--box);border-radius:12px;font-size:12px}
#edunote-reader .comparison summary{padding:10px 12px;font-size:12px;font-weight:500}
#edunote-reader .comparison summary .minor{display:block;padding-left:14px;font-size:11px}
#edunote-reader .comparison-body{padding:0 12px 10px}
#edunote-reader .teacher-letter{margin:26px 0;padding-left:16px;border-left:3px solid var(--line)}
#edunote-reader .teacher-letter>p{font-size:16px;line-height:1.75;margin:10px 0 0}
#edunote-reader .teacher-letter strong{font-weight:700}
#edunote-reader .teacher-letter details{border:0;margin-top:4px;padding:0}
#edunote-reader .teacher-letter summary{font-size:12px;font-weight:500;color:var(--muted);min-height:44px}
#edunote-reader .section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px}
#edunote-reader .section-heading h2{margin:0}
#edunote-reader .task{display:flex;width:100%;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
#edunote-reader .task-icon{background:var(--box);border-radius:14px;width:42px;height:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#edunote-reader .task strong{display:block;font-size:15px;font-weight:650}
#edunote-reader .task small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
#edunote-reader .tail{margin-left:auto;flex-shrink:0;color:var(--muted)}
#edunote-reader .period-peek{display:flex;justify-content:space-between;gap:12px;width:100%;padding:14px 0;margin-top:10px;color:var(--muted);font-size:12px}
#edunote-reader .page-title{padding-top:4px}
#edunote-reader .page-title h1{margin-top:6px}
#edunote-reader .ledger-head,#edunote-reader .ledger-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;align-items:center;gap:8px}
#edunote-reader .ledger-head{color:var(--muted);font-size:11px;padding:8px 0;border-bottom:1px solid var(--line)}
#edunote-reader .ledger-row{font-size:17px;padding:16px 0;font-weight:600;font-variant-numeric:tabular-nums}
#edunote-reader .ledger-row small{font-size:11px;font-weight:400;color:var(--muted)}
#edunote-reader .ledger-row>div small{display:block;margin-top:4px}
#edunote-reader .ledger-session{margin:0;padding:0;border-top:0;border-bottom:1px solid var(--line)}
#edunote-reader .ledger-session>summary{list-style:none;padding:0}
#edunote-reader .ledger-session>summary::-webkit-details-marker{display:none}
#edunote-reader .ledger-session[open] .ledger-row>div strong{color:var(--accent)}
#edunote-reader .session-detail{border-top:1px solid var(--line);padding:16px 0 10px;font-size:13px}
#edunote-reader .session-detail .link{display:block;font-size:13px}
#edunote-reader .attendance-summary{display:flex;gap:40px;margin:4px 0 26px}
#edunote-reader .attendance-summary strong{display:block;font-size:28px;font-weight:650;margin-top:6px}
#edunote-reader .attendance-summary small{display:block;font-size:12px;color:var(--muted);font-weight:400}
#edunote-reader .calendar{gap:6px;line-height:2;font-size:13px}
#edunote-reader .analysis-lead{background:var(--panel);border-radius:20px;padding:22px;margin:0 0 26px}
#edunote-reader .analysis-key{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:12px}
#edunote-reader .analysis-key h2{font-size:22px;margin:0}
#edunote-reader .analysis-key>strong{font-size:28px;white-space:nowrap}
#edunote-reader .analysis-key small{font-size:12px;font-weight:400;color:var(--muted)}
#edunote-reader .analysis-lead p{font-size:14px;color:var(--muted);margin:12px 0}
#edunote-reader .analysis-lead .action{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:12px 14px}
#edunote-reader .type-line{padding:4px 0 12px}
#edunote-reader .type-control{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font-size:14px;min-height:44px}
#edunote-reader .type-control>span{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
#edunote-reader .type-control small{color:var(--muted);font-size:12px}
#edunote-reader .type-line .track{height:5px;margin:0}
#edunote-reader .section-spaced{padding-top:20px;border-top:1px solid var(--line);margin-top:20px}
#edunote-reader .area-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
#edunote-reader .area-grid>div>span{display:block;font-size:13px}
#edunote-reader .area-grid strong{display:block;font-size:26px;line-height:1.8;font-weight:650}
#edunote-reader .area-grid small{font-size:13px;font-weight:400}
#edunote-reader .area-grid .minor{font-size:11px}
#edunote-reader .pattern{position:relative;padding:18px 0;border-bottom:1px solid var(--line)}
#edunote-reader .pattern>strong{margin-left:10px;font-size:15px}
#edunote-reader .pattern p{margin:8px 0 0}
#edunote-reader .pattern>small{font-size:12px;color:var(--muted)}
#edunote-reader.tab-wrong .block{background:transparent;padding:0;border-radius:0}
#edunote-reader.tab-wrong .block>h2{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding:14px 0;margin:0}
#edunote-reader.tab-wrong .row{padding:18px 0}
#edunote-reader.tab-wrong .stem{font-size:16px;font-weight:500;margin:12px 0}
#edunote-reader .reader-counter{font-size:12px;color:var(--muted);margin:16px 0}
#edunote-reader .reader-tools{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:20px;gap:10px}
#edunote-reader .reader-tools .link{font-size:13px}
#edunote-reader.reading-mode .stem{font-size:18px;font-weight:700;line-height:1.6;margin:20px 0}
#edunote-reader.reading-mode .reading{font-size:var(--reading-size,17px);line-height:1.85;padding:18px 0}
#edunote-reader.reading-mode .note{background:transparent;border-radius:0;border-left:3px solid var(--line);padding:4px 0 4px 16px;line-height:1.85;margin-top:24px}
#edunote-reader .reading-route{display:flex;gap:8px;margin-top:24px}
#edunote-reader .reading-route button{flex:1;min-height:48px;text-align:center;background:var(--box);border-radius:12px;font-size:13px}
#edunote-reader.tab-vocab main>h1{font-size:28px}
#edunote-reader.tab-vocab .search{font-size:12px;color:var(--muted)}
#edunote-reader.tab-vocab .search input{margin-top:8px;border:0;border-radius:14px;font-size:16px;color:var(--ink)}
#edunote-reader.tab-vocab .segment{gap:14px;margin-bottom:10px}
#edunote-reader.tab-vocab .segment button{font-size:12px}
#edunote-reader.tab-vocab .block{background:transparent;border-radius:0;border-bottom:1px solid var(--line);padding:20px 0;margin:0}
#edunote-reader.tab-vocab .block>h2{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:2px}
#edunote-reader.tab-vocab .block>.minor{display:block;font-size:11px;margin-bottom:8px}
#edunote-reader.tab-vocab .block>p{font-size:15px}
#edunote-reader.tab-vocab .block>p:not(.answer){margin-bottom:8px}
#edunote-reader.tab-vocab .block details{border:0;margin:0;padding:0}
#edunote-reader.tab-vocab .block summary{font-size:12px;color:var(--muted);font-weight:500}
#edunote-reader.tab-vocab .block .answer{background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
#edunote-reader nav{padding:8px 10px 14px;background:var(--panel)}
#edunote-reader nav button{font-size:11px;font-weight:500;gap:5px;padding:8px 2px;min-height:52px}
#edunote-reader nav button[aria-current=page]{color:var(--ink)}
#edunote-reader nav button[aria-current=page] svg{background:var(--box);border-radius:8px;box-sizing:content-box;padding:4px;margin:-4px}
@media(max-width:360px){#edunote-reader main{padding-left:16px;padding-right:16px}#edunote-reader h1{font-size:26px}#edunote-reader .score-strip strong{font-size:27px}#edunote-reader .score-strip em{font-size:11px}#edunote-reader .analysis-key h2{font-size:19px}}
</style>

<script>
(()=>{
const root=document.getElementById('edunote-reader');
let state={tab:'home',sub:'reading',scope:'period',att:'regular',metric:'reading',homeMode:'recent',recordMode:'sessions',page:null,search:'',mode:'all',pos:'all',week:'all',example:'all',passage:'all',question:0,recordFocus:1,returnTab:'wrong'};
const opts={questionView:'list',wordDetail:false,readingSize:17,separateSummary:true};
const b=(t,a,c='',extra='')=>`<button type="button" class="cursor-interaction ${c}" data-action="${a}" ${extra}>${t}</button>`;
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const segment=(items,value,prefix)=>`<div class="segment">${items.map(([id,label])=>b(label,prefix+':'+id,'',`aria-pressed="${id===value}"`)).join('')}</div>`;
const block=(title,body)=>`<section class="block"><h2>${title}</h2>${body}</section>`;
const fold=(title,body,open=false)=>`<details ${open?'open':''}><summary class="cursor-interaction">${title}</summary>${body}</details>`;
const words=[{word:'adapt',meaning:'적응하다',pos:'동사',week:'2',passage:'A',mine:'채택하다',status:'pending',syn:'adjust',ant:'resist',der:'adaptation · 적응',ex:'We adapt to new environments.',ko:'우리는 새로운 환경에 적응한다.'},{word:'maintain',meaning:'유지하다',pos:'동사',week:'2',passage:'A',mine:'',status:'pending',syn:'preserve',ant:'abandon',der:'maintenance · 유지',ex:'Maintain a regular study schedule.',ko:'규칙적인 학습 일정을 유지해라.'},{word:'evidence',meaning:'증거',pos:'명사',week:'1',passage:'B',mine:'사건',status:'done',syn:'proof',ant:'',der:'evident · 분명한',ex:'Find evidence in the passage.',ko:'지문에서 근거를 찾아라.'},{word:'reliable',meaning:'믿을 만한',pos:'형용사',week:'1',passage:'B',mine:null,status:'clean',syn:'dependable',ant:'unreliable',der:'reliability · 신뢰성',ex:'',ko:''}];
const q=[{label:'빈칸 추론',number:3,stem:'다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?',passage:'Students often focus only on their final score. However, improvement begins when they look closely at why an answer was wrong. Comparing their reasoning with evidence in the passage helps them discover patterns in their mistakes. In this way, mistakes can become ________.',choices:['proof that learning should stop','useful information for future learning','a reason to avoid difficult questions'],mine:3,answer:2,explain:'점수보다 오답의 원인을 살피는 과정이 중요하다는 내용이에요. “In this way”가 앞의 과정을 받으므로, 실수는 다음 학습에 도움이 되는 정보가 된다는 ②가 알맞아요.',comment:'빈칸 앞 문장의 evidence와 patterns에 밑줄을 그어 보세요.'},{label:'주장 파악',number:7,stem:'다음 글에서 필자의 주장으로 가장 적절한 것은?',passage:'A short study session every day can be more effective than a long session once a week. Repeatedly returning to the same material helps you recall it. Set aside a small amount of time each day.',choices:['Study a little every day.','Study only when you have several hours.','Avoid reviewing the same material.'],mine:2,answer:1,explain:'매일 짧게 시간을 내라는 마지막 문장에 필자의 주장이 나타나요.',comment:'결론 문장을 먼저 확인해 보세요.'}];
function restore(w){if(w?.privateContent?.version!==3)return;state={...state,...w.privateContent.state};Object.assign(opts,w.privateContent.options);state.search=typeof state.search==='string'?state.search:'';}
restore(window.openai?.widgetState);
function save(){window.openai?.setWidgetState({modelContent:{design:'리포트와 집중 읽기 재설계',tab:state.tab,questionView:opts.questionView,wordDetails:opts.wordDetail,separateSummary:opts.separateSummary},privateContent:{version:3,state,options:opts}})?.catch(()=>{});}
const escape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function metrics(){const rows=[['reading','독해',70,'+20%p','+5%p'],['vocab','단어',75,'+10%p','+3%p'],['homework','과제',90,'+20%p',null]];const selected=rows.find(x=>x[0]===state.metric);const values=state.metric==='reading'?[60,80]:state.metric==='vocab'?[70,80]:[80,100];const avgs=state.metric==='reading'?[60,70]:[70,74];const y=n=>110-n*.8;return `${rows.map(([id,label,mean,delta,comp])=>b(`${label}<strong>${mean}%</strong><span class="minor"> · 기간 평균</span><small>직전 회차 대비 ${delta}${comp?' · 기간 반 비교 '+comp:''}</small><span class="minor">${state.metric===id?'추이 선택됨':'추이 보기'}</span>`,'metric:'+id,'metric',`aria-pressed="${state.metric===id}"`)).join('')}<div class="section-heading"><h2>${selected[1]} 추이</h2><span class="minor">단위 %</span></div><svg class="report-plot" width="100%" height="140" role="img" aria-label="${selected[1]} 9월 17일 ${values[0]}%, 24일 ${values[1]}%${state.metric==='homework'?'':', 반 평균 '+avgs.join('%, ')+'%'}"><line x1="12%" x2="88%" y1="110" y2="110" stroke="var(--line)"/>${state.metric==='homework'?'':`<line x1="16%" x2="84%" y1="${y(avgs[0])}" y2="${y(avgs[1])}" stroke="var(--muted)" stroke-dasharray="4 5" stroke-width="1.5"/>`}<line x1="16%" x2="84%" y1="${y(values[0])}" y2="${y(values[1])}" stroke="var(--accent)" stroke-width="2.5"/>${values.map((v,i)=>`<circle cx="${i?84:16}%" cy="${y(v)}" r="4" fill="var(--accent)"/><text x="${i?84:16}%" y="${y(v)-12}" text-anchor="middle" fill="var(--ink)" font-size="14">${v}%</text><text x="${i?84:16}%" y="132" text-anchor="middle" fill="var(--muted)" font-size="12">9/${i?24:17}</text>`).join('')}</svg><p class="minor">실선: 내 결과${state.metric==='homework'?'':' · 점선: 반 평균'}</p><div class="graph">${values.map((v,i)=>b(`9/${i?24:17} 기록 ${icon('arrow-up-right')}`,'history:'+i,'point')).join('')}</div>${b('출결 · 2회 연속 출석 →','attendance','row')}`;}
function home(){
const recent=`<div class="report-heading"><div class="eyebrow">최근 수업 · 9월 24일</div><h1>독해·단어 모두<br>직전보다 올랐어요.</h1><span class="attendance-mark">${icon('check')} 출석</span></div>
<div class="score-strip"><div><span>독해</span><strong>8<small>/10</small></strong><em>직전보다 +20%p</em></div><div><span>단어</span><strong>16<small>/20</small></strong><em>직전보다 +10%p</em></div><div><span>과제</span><strong>5<small>/5</small></strong><em>모두 제출했어요</em></div></div>
<details class="comparison"><summary class="cursor-interaction">반 평균과 비교 <span class="minor">독해 +10%p · 단어 +6%p</span></summary><div class="comparison-body"><p>독해 내 정답률 80% · 반 평균 70%</p><p>단어 내 정답률 80% · 반 평균 74%</p></div></details>
<section class="teacher-letter"><div class="eyebrow">선생님이 남긴 말</div><p>글의 흐름을 잘 따라가고 있어요.<br><strong>빈칸 앞뒤에서 근거를 찾는 연습</strong>을 해 보세요.</p>${fold('이전 코멘트 1개','<div class="minor">9월 17일 · 1회차</div><p>오답을 확인할 때 연결어에 표시해 보세요.</p>')}</section>
<section class="next-step"><div class="section-heading"><h2>이어서 복습하기</h2><span class="minor">9월 2회차</span></div>${b(`<span class="task-icon">${icon('book-open')}</span><span><strong>틀린 독해 2문항</strong><small>내 답과 근거 확인하기</small></span><span class="tail">${icon('arrow-up-right')}</span>`,'wrong:reading','task')}${b(`<span class="task-icon">${icon('languages')}</span><span><strong>단어 재시험 2개 남음</strong><small>이번 수업 오답 4개 중 2개 통과</small></span><span class="tail">${icon('arrow-up-right')}</span>`,'wrong:vocab','task')}</section>`;
const summary=`<div class="report-heading"><div class="eyebrow">9월 · 2회차 누적</div><h1>꾸준히 쌓인 변화</h1><p class="minor">기간 평균과 최근 수업의 변화를 나눠 보세요.</p></div>${metrics()}`;
return opts.separateSummary?`${segment([['recent','최근 수업'],['period','기간 요약 · 2회']],state.homeMode||'recent','homeMode')}${state.homeMode==='period'?summary:recent}`:`${recent}<section class="section-spaced">${summary}</section>`;
}
function record(){
const detail=(i)=>`<div class="session-detail"><dl class="facts"><dt>반 비교</dt><dd>독해 ${i?'+10':'0'}%p · 단어 ${i?'+6':'0'}%p</dd><dt>재시험</dt><dd>${i?'2/4 통과 · 2개 남음':'아직 응시하지 않음'}</dd><dt>오답 유형</dt><dd>${i?'빈칸 추론 · 주장 파악':'빈칸 추론 · 어법'}</dd></dl><div class="note"><span class="eyebrow">선생님 코멘트</span><p>${i?'빈칸 앞뒤 문장에서 근거를 찾아보세요.':'연결어에 표시하며 읽어보세요.'}</p></div>${i?b('이 회차 독해 오답 보기 →','wrong:reading','link')+b('틀린 단어 4개 보기 →','wrong:vocab','link'):'<p class="minor">과거 회차 전문은 시안에서 생략했어요.</p>'}</div>`;
return `<div class="page-title"><span class="eyebrow">성적부터 출결까지</span><h1>수업의 기록</h1></div>${segment([['sessions','회차별'],['attendance','출결']],state.recordMode||'sessions','recordMode')}${state.recordMode==='attendance'?attendance():`${segment([['period','9월'],['all','전체 기간']],state.scope,'scope')}<div class="ledger-head"><span>수업</span><span>독해</span><span>단어</span><span>과제</span></div>${[1,0].map(i=>`<details class="ledger-session" ${state.recordFocus===i?'open':''}><summary class="cursor-interaction"><div class="ledger-row"><div><strong>9.${i?24:17}</strong><small>${i+1}회차 · 출석</small></div><span>${i?8:6}<small>/10</small></span><span>${i?16:14}<small>/20</small></span><span class="${i?'':'warn'}">${i?5:4}<small>/5</small></span></div></summary>${detail(i)}</details>`).join('')}${state.scope==='all'?`<div class="ledger-row"><div><strong>8.27</strong><small>8월 · 출석</small></div><span>7<small>/10</small></span><span>15<small>/20</small></span><span>5<small>/5</small></span></div>`:''}<p class="minor" style="margin-top:18px">회차를 펼치면 반 비교·재시험·코멘트가 보여요.</p>`}`;
}
function attendance(){return `<div class="attendance-summary"><div><span class="minor">정규수업</span><strong>${state.scope==='all'?'3/3':'2/2'}<small>회 출석</small></strong></div><div><span class="minor">클리닉</span><strong>1/2<small>회 출석</small></strong></div></div>${segment([['regular','정규수업'],['clinic','클리닉']],state.att,'att')}<div class="section-heading"><h2>2026년 9월</h2><span class="minor">${state.att==='clinic'?'결석 1회':'모두 출석'}</span></div><div class="calendar">${['일','월','화','수','목','금','토'].map(v=>`<span class="minor">${v}</span>`).join('')}<span></span><span></span>${Array.from({length:30},(_,i)=>`<span class="day ${state.att==='regular'&&[17,24].includes(i+1)||state.att==='clinic'&&i+1===19?'present':state.att==='clinic'&&i+1===26?'absent':''}">${i+1}${state.att==='clinic'&&i+1===26?'×':''}</span>`).join('')}</div><p class="minor" style="margin-top:18px">굵은 날짜: 출석 · ×: 결석</p>`;}
function analysis(){return `<div class="page-title"><span class="eyebrow">9월 · 2회차 · 20문항</span><h1>어디를 더 살펴볼까요?</h1></div><section class="analysis-lead"><span class="eyebrow">오답이 가장 많은 유형</span><div class="analysis-key"><h2>빈칸 추론</h2><strong>3<small>/5 오답</small></strong></div><p>정답률은 올랐지만,<br>아직 틀린 문제가 남아 있어요.</p>${b('빈칸 문제 확인하기 '+icon('arrow-right'),'type','action')}</section><div class="section-heading"><h2>유형별 오답률</h2><span class="minor">오답 / 출제</span></div>${[['빈칸 추론',60,'3/5','type'],['어법',40,'2/5',null],['주장 파악',20,'1/5','type:claim'],['내용 일치',0,'0/5',null]].map(([label,rate,ratio,action])=>`<div class="type-line">${action?b(`<strong>${label}</strong><span>${rate}% <small>${ratio}</small> ${icon('chevron-right')}</span>`,action,'type-control'):`<div class="type-control"><strong>${label}</strong><span>${rate}% <small>${ratio}</small></span></div>`}<div class="track"><div class="fill" style="width:${rate}%;background:${rate>=50?'var(--danger)':'var(--muted)'}"></div></div></div>`).join('')}<section class="section-spaced"><div class="section-heading"><h2>영역별 정답률</h2></div><div class="area-grid">${[['이해',90,'주장·내용 일치'],['추론',40,'빈칸'],['어법',60,'문장 구조']].map(([name,value,tags])=>`<div><span>${name}</span><strong>${value}<small>%</small></strong><span class="minor">${tags}</span></div>`).join('')}</div></section><section class="section-spaced"><h2>반복되는 패턴</h2><div class="pattern"><span class="badge">개선</span><strong>빈칸 추론</strong><p>1회차 0/2 → 2회차 2/3</p><small>누적 정답률 40% · 2/5</small></div><div class="pattern"><span class="badge">악화</span><strong>주장 파악</strong><p>1회차 2/2 → 2회차 2/3</p><small>누적 정답률 80% · 4/5</small></div></section>`;}
function questionBody(item){return `<p class="stem">${item.stem}</p><p class="reading" lang="en">${item.passage}</p>${item.choices.map((c,i)=>`<p class="reading" lang="en">${['①','②','③'][i]} ${c}</p>`).join('')}<p class="answer"><span class="warn">내 답 ${item.mine}</span> · 정답 ${item.answer}</p><div class="note"><h2>해설</h2><p>${item.explain}</p><p class="minor">선생님 첨삭</p><p>${item.comment}</p></div>`;}
function wrong(){if(state.sub==='vocab')return `<h1>오답</h1>${segment([['reading','진단평가 6'],['vocab','단어 10']],state.sub,'sub')}${block('9월 2회차 · 9/24',`<p>4개 오답 · 재시험 2/4 통과</p><p class="minor">남은 2개를 단어장에서 확인할 수 있어요.</p>${words.slice(0,2).map(w=>`<div class="row"><strong>${w.word}</strong><span class="badge">뜻 쓰기 · 재시험 대기</span><p class="answer"><span class="warn">${w.mine||'미작성'}</span> → ${w.meaning}</p><span class="minor">유의어 ${w.syn} · 반의어 ${w.ant}</span></div>`).join('')}${b('재시험 남은 단어 보기 →','vocab:pending','action')}${fold('통과한 단어 2개','<p>impact · 영향 · 재시험 통과</p><p>approach · 접근법 · 재시험 통과</p>')}`)}${fold('9월 1회차 · 6개 오답','<p>재시험 미응시</p><p>evidence, context, reflect, obtain, improve, concern</p>')}`;return `<h1>${state.page==='type'?'유형별 오답':'오답'}</h1>${state.page==='type'?`${b('분석으로 돌아가기','back-analysis','link')}<p class="badge">9월 · ${state.type==='claim'?'주장 파악':'빈칸 추론'}</p>`:segment([['reading','진단평가 6'],['vocab','단어 10']],state.sub,'sub')}<p class="minor">최근 수업 2문항 · 기간 전체 6문항</p>${block('9월 2회차 · 9/24',q.filter(x=>state.page!=='type'||x.label===(state.type==='claim'?'주장 파악':'빈칸 추론')).map(item=>{const i=q.indexOf(item);return `<div class="row"><span class="badge">${item.number}번 · ${item.label}</span>${opts.questionView==='inline'?questionBody(item):`<p class="stem">${item.stem}</p><p><span class="warn">내 답 ${item.mine}</span> · 정답 ${item.answer}</p>${b('문제·해설 읽기 →','question:'+i,'link')}`}</div>`}).join(''))}${state.page==='type'?'':fold('9월 1회차 · 오답 4문항','<p>빈칸 추론 2문항 · 어법 2문항</p><p class="minor">이 구조 시안의 문제 전문은 최근 회차 2문항을 사용해요.</p>')}`;}
function vocab(){const active=words.filter(w=>(state.mode==='all'||state.mode==='wrong'&&w.mine!==null||state.mode==='pending'&&w.status==='pending'||state.mode==='empty'&&w.mine==='')&&(state.pos==='all'||w.pos===state.pos)&&(state.week==='all'||w.week===state.week)&&(state.passage==='all'||w.passage===state.passage)&&(state.example==='all'||state.example==='yes'&&!!w.ex||state.example==='no'&&!w.ex)&&[w.word,w.meaning,w.syn,w.ant].some(v=>v.toLowerCase().includes(state.search.toLowerCase())));return `<h1>단어장</h1><p class="minor">샘플 단어장 4개 중 ${active.length}개 표시</p><label class="search">단어·뜻·유의어·반의어 검색<input id="preserved-search" type="search" value="${escape(state.search)}" placeholder="예: adjust" /></label>${segment([['all','전체'],['wrong','오답'],['pending','재시험 남음'],['empty','미작성']],state.mode,'mode')}${fold('상세 조건', [['week','주차',[['all','전체'],['1','1회차'],['2','2회차']]],['passage','지문',[['all','전체'],['A','A'],['B','B']]],['pos','품사',[['all','전체'],['명사','명사'],['동사','동사'],['형용사','형용사']]],['example','예문',[['all','전체'],['yes','있음'],['no','없음']]]].map(([key,label,values])=>`<label>${label}<select data-filter="${key}">${values.map(([value,text])=>`<option value="${value}" ${state[key]===value?'selected':''}>${text}</option>`).join('')}</select></label>`).join('')+b('조건 초기화','reset','link'),state.week!=='all'||state.pos!=='all'||state.example!=='all'||state.passage!=='all')}<p class="minor">${[state.week!=='all'?state.week+'회차':'',state.pos!=='all'?state.pos:'',state.passage!=='all'?'지문 '+state.passage:'',state.example!=='all'?'예문 '+(state.example==='yes'?'있음':'없음'):''].filter(Boolean).join(' · ')||'추가 조건 없음'}</p>${active.map(w=>block(w.word,`<span class="minor">${w.week}회차 · 지문 ${w.passage} · ${w.pos}</span><p>${w.meaning}</p>${w.mine!==null?`<span class="badge">${w.status==='done'?'재시험 통과':'재시험 대기'}</span><p class="answer"><span class="warn">${w.mine||'미작성'}</span> → ${w.meaning}</p>`:''}<p>유의어 ${w.syn}${w.ant?' · 반의어 '+w.ant:''}</p>${fold('파생어·예문·번역',`<p>${w.der}</p>${w.ex?`<p class="reading" lang="en">${w.ex}</p><p>${w.ko}</p>`:'<p class="minor">등록된 예문 없음</p>'}`,opts.wordDetail)}`)).join('')||'<p>조건에 맞는 단어가 없어요.</p>'}`;}
function render(){root.className='tab-'+state.tab+(state.page==='question'?' reading-mode':'');root.style.setProperty('--reading-size',opts.readingSize+'px');const detail=state.page==='question';let body=detail?`<div class="reader-tools">${b('← 목록으로','back','link')}<span class="minor">문제와 해설 · 집중 읽기</span></div><p class="reader-counter">9월 2회차 · ${q[state.question].number}번 · ${q[state.question].label}</p>${questionBody(q[state.question])}${b(state.question===0?'다음 문제 읽기 →':'← 이전 문제 읽기','question:'+(state.question===0?1:0),'action')}`:state.tab==='home'?home():state.tab==='record'?record():state.tab==='analysis'?analysis():state.tab==='wrong'?wrong():vocab();root.innerHTML=`<div class="stamp">EDUNOTE / 리포트 시안 · 가상 데이터</div><header><div><div class="minor">고2 · 영어반</div><div class="name">민서</div></div><span class="badge">9월 · 2회차</span></header><main>${body}</main>${detail?'':`<nav aria-label="주요 화면">${[['home','홈','house'],['record','기록','history'],['analysis','분석','chart-no-axes-combined'],['wrong','오답','book-open'],['vocab','단어','languages']].map(([id,label,i])=>b(icon(i)+label,'tab:'+id,'',`aria-current="${state.tab===id?'page':'false'}"`)).join('')}</nav>`}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
root.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const [a,v]=target.dataset.action.split(':');if(a==='tab'){state.tab=v;state.page=null}else if(['metric','scope','att','sub','mode','homeMode','recordMode'].includes(a)){state[a]=v}else if(a==='wrong'){state.tab='wrong';state.sub=v;state.page=null}else if(a==='vocab'){state.tab='vocab';state.mode=v;state.page=null}else if(a==='history'||a==='attendance'){state.tab='record';state.page=null;state.recordFocus=a==='history'?Number(v):1;state.recordMode=a==='attendance'?'attendance':'sessions'}else if(a==='type'){state.tab='wrong';state.sub='reading';state.page='type';state.type=v||'blank'}else if(a==='question'){if(state.page!=='question')state.returnPage=state.page;state.page='question';state.question=Number(v)}else if(a==='back'){state.page=state.returnPage||null}else if(a==='back-analysis'){state.tab='analysis';state.page=null}else if(a==='reset'){Object.assign(state,{mode:'all',search:'',week:'all',pos:'all',passage:'all',example:'all'})}render();save();if(a==='history'){root.querySelectorAll('.ledger-session')[v==='0'?1:0]?.scrollIntoView({block:'start'})}else if(a==='attendance'){root.querySelector('.attendance-summary')?.scrollIntoView({block:'start'})}});
root.addEventListener('change',event=>{if(event.target.dataset.filter){state[event.target.dataset.filter]=event.target.value;render();save()}});
root.addEventListener('input',event=>{if(event.target.id==='preserved-search'){state.search=event.target.value;const start=event.target.selectionStart;render();const input=root.querySelector('#preserved-search');input.focus();try{input.setSelectionRange(start,start)}catch{}save()}});
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){const incoming=event.detail.globals.widgetState;if(JSON.stringify(incoming.privateContent?.state)===JSON.stringify(state)&&JSON.stringify(incoming.privateContent?.options)===JSON.stringify(opts))return;restore(incoming);render()}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save()}});tweak.addToggle(opts,'separateSummary',{label:'최근 수업과 기간 요약 분리'});tweak.addSelect(opts,'questionView',{label:'오답 읽기 방식',options:[{label:'목록 → 별도 읽기',value:'list'},{label:'목록에서 전문 읽기',value:'inline'}]});tweak.addToggle(opts,'wordDetail',{label:'단어 학습 정보 기본 펼침'});tweak.addSlider(opts,'readingSize',{label:'문제 본문 크기',min:16,max:19,step:1,unit:'px'});}
})();
</script>
